name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  GO_VERSION: "1.25"
  GOPROXY: "https://goproxy.cn,direct"
  COVERAGE_TARGET: "80"
  COVERAGE_BASELINE: "38.0"

jobs:
  static-checks:
    name: Static Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Generate proto contracts
        run: make proto-gen

      # 名单式守卫:手写 DTO 残留即 CI 红(纯静态 find/grep,不依赖生成物)
      - name: Enforce no hand-written DTO residue
        run: bash scripts/quality/dto-residue-guard.sh

      - name: Verify generated agent instructions
        run: make agent-instructions-check

      - name: Verify unified verification contracts
        run: make verification-manifest-test verification-schemas-test verification-ci-contract-test test-verification-entrypoints-test

  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: tool_permission_ci_only
          POSTGRES_DB: stratum_tool_permission
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d stratum_tool_permission"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      STRATUM_TEST_POSTGRES_URL: postgres://postgres:tool_permission_ci_only@127.0.0.1:5432/stratum_tool_permission?sslmode=disable
    steps:
      # fetch-depth: 0 是基线防刷守卫的 load-bearing 前提：
      # 守卫需 git merge-base origin/main HEAD 取 PR fork 点，
      # 浅检出(默认)只有 merge ref、无完整历史，缺它守卫会 fail-closed 报错
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Generate proto contracts
        run: make proto-gen

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      # runner 预装的 microsoft apt 源(packages.microsoft.com)返回 403
      # 导致 apt-get update 整体失败;先移除该源再安装
      - name: Install ripgrep
        run: |
          if command -v rg >/dev/null 2>&1; then
            echo "ripgrep already available: $(command -v rg)"
            exit 0
          fi
          # code-quality-ratchet only needs rg's basic -n pattern/file mode.
          # Avoid a network-dependent apt install on hosted runners.
          sudo tee /usr/local/bin/rg >/dev/null <<'SH'
          #!/usr/bin/env bash
          exec grep "$@"
          SH
          sudo chmod +x /usr/local/bin/rg
          echo "installed bounded rg compatibility shim"

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci

      - name: Test risk regression guard
        run: bash scripts/quality/risk-regression-guard-test.sh

      - name: Test incremental Go test harness
        run: bash scripts/quality/incremental-go-test-test.sh

      # 基线防刷守卫先于 ratchet:PR 扩容基线在 make code-quality 放行前拦截;
      # PR 事件用 GITHUB_BASE_REF 走 merge-base,push 事件用 github.event.before
      # (push 无 base ref,actions/checkout 不取 merge ref,HEAD 即新 tip,不能比较)
      - name: Enforce baseline integrity (baseline may only shrink)
        env:
          BEFORE_REF: ${{ github.event.before }}
        run: bash scripts/quality/check-baseline-integrity.sh --ci

      - name: Enforce incremental Go code quality
        run: make code-quality

      - name: Enforce risk regression guard
        run: bash scripts/quality/risk-regression-guard.sh --all

  frontend:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Generate proto contracts
        run: make proto-gen

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci

      - name: Lint, typecheck, build
        run: make fe-lint fe-typecheck fe-build

      - name: Unit tests
        run: make fe-test

  safety-guards:
    name: Safety Guards
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: tool_permission_ci_only
          POSTGRES_DB: stratum_tool_permission
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d stratum_tool_permission"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      STRATUM_TEST_POSTGRES_URL: postgres://postgres:tool_permission_ci_only@127.0.0.1:5432/stratum_tool_permission?sslmode=disable
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Generate proto contracts
        run: make proto-gen

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci

      - name: Test Agent tool permission harness
        run: make tool-permission-test

  migration-rollback:
    name: Migration Rollback Verification
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: migration_ci_only
          POSTGRES_DB: stratum_migration
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d stratum_migration"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      STRATUM_TEST_POSTGRES_URL: postgres://postgres:migration_ci_only@127.0.0.1:5432/stratum_migration?sslmode=disable
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Generate proto contracts
        run: make proto-gen

      # 真实 PG 全量迁移回滚验证:Up → 逆序 Down → 从零重放 Up。
      # env 一设,pkg/storage/postgres 的 12 个 tenant schema 集成测试
      # (回滚/幂等/历史升级)首次真正进 CI;STRATUM_TEST_POSTGRES_URL
      # 未设时二者均 t.Skip,历史 CI 全部空转——本 job 堵住该缺口。
      - name: Verify public-schema migrations roll back cleanly
        run: go test -v -count=1 -timeout=10m ./pkg/migration ./pkg/storage/postgres

  guardrails:
    name: Migration Guardrails
    runs-on: ubuntu-latest
    needs: [static-checks, code-quality, frontend, safety-guards, migration-rollback]
    if: ${{ always() }}
    steps:
      - name: Require every guardrail dependency to succeed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          jq -e 'all(.[]; .result == "success")' <<<"$NEEDS_JSON"

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Generate proto contracts
        run: make proto-gen

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12.2
          args: --timeout=5m

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Generate proto contracts
        run: make proto-gen

      - name: Run tests
        run: go test -v -race -coverprofile=coverage.out ./... -timeout=5m

      - name: Report coverage
        run: |
          COVERAGE=$(go tool cover -func=coverage.out | tail -1 | awk '{print $3}' | tr -d '%')
          echo "Total coverage: ${COVERAGE}%"
          if awk "BEGIN{exit !($COVERAGE < $COVERAGE_BASELINE)}"; then
            echo "::error::Coverage ${COVERAGE}% is below enforced baseline ${COVERAGE_BASELINE}%"
            exit 1
          fi
          if awk "BEGIN{exit !($COVERAGE < $COVERAGE_TARGET)}"; then
            echo "::warning::Coverage ${COVERAGE}% is below the ${COVERAGE_TARGET}% target"
          fi

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.out
          retention-days: 7

  contract:
    name: Contract Goldens
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Generate proto contracts
        run: make proto-gen

      - name: Run contract golden tests
        run: make contract-enforce

  workflow-e2e:
    name: Workflow E2E
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: workflow_e2e_ci_only
          POSTGRES_DB: stratum_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d stratum_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      STRATUM_TEST_POSTGRES_URL: postgres://postgres:workflow_e2e_ci_only@127.0.0.1:5432/stratum_e2e?sslmode=disable
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Generate proto contracts
        run: make proto-gen

      - name: Run Workflow HTTP/PostgreSQL/worker E2E
        run: go test -tags=integration ./test/e2e -run TestWorkflowHTTPPostgresWorkerApprovalRestartAndSSEE2E -count=1 -v

  platform-assistant-e2e:
    name: Platform Assistant PostgreSQL E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Generate proto contracts
        run: make proto-gen

      - name: Run platform assistant PostgreSQL E2E
        run: bash scripts/test-platform-assistant-e2e.sh

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [guardrails, lint, test, contract, workflow-e2e, platform-assistant-e2e]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Generate proto contracts
        run: make proto-gen

      - name: Build binary
        run: go build -o bin/server ./cmd/server

      - name: go vet
        run: go vet ./...

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Generate proto contracts
        run: make proto-gen

      - name: Install gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@v2.25.0

      - name: Run gosec
        run: gosec -severity high -confidence high -fmt=sarif -out=results.sarif ./...

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: results.sarif
        continue-on-error: true
