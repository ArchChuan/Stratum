name: Stateful Browser E2E

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

env:
  GO_VERSION: "1.25"
  GOPROXY: "https://goproxy.cn,direct"

jobs:
  platform-assistant-browser-e2e:
    name: Platform Assistant Browser E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefix web

      - name: Install Chromium
        run: npx --prefix web playwright install --with-deps chromium

      - name: Run platform assistant browser E2E
        run: bash scripts/test-platform-assistant-browser-e2e.sh

  tool-permission-browser:
    name: Agent Tool Permission Browser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci

      - name: Install Chromium
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Run Agent tool permission browser harness
        working-directory: web
        run: npx playwright test e2e/agent-tool-permission.spec.ts --project=mobile-320 --project=desktop-1440

  stateful-e2e:
    name: Stateful Browser E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      STRATUM_TEST_POSTGRES_URL: postgres://stratum:stratum@127.0.0.1:5432/stratum_e2e?sslmode=disable
      REDIS_URL: redis://127.0.0.1:6379
      NATS_URL: nats://127.0.0.1:4222
      MILVUS_HOST: 127.0.0.1
      MILVUS_PORT: "19530"
      STATEFUL_E2E_PACKS: dashboard,iam,workflow,agent,skill,mcp,agent-skill-mcp,knowledge,memory,llm-admin
      STATEFUL_E2E_DURATION_SEC: "600"
      STATEFUL_E2E_INFRA_UP_COMMAND: bash scripts/e2e/ci-infra-up.sh
      STATEFUL_E2E_INFRA_DOWN_COMMAND: bash scripts/e2e/ci-infra-down.sh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefix web

      - name: Install Chromium
        run: npx --prefix web playwright install --with-deps chromium

      - name: Run stateful browser E2E
        run: make e2e-system-short

      - name: Upload attestation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stateful-e2e-attestation
          path: test/e2e/attestations/
          retention-days: 7
