name: Release Verification

on:
  workflow_dispatch:
    inputs:
      artifact_digest:
        description: Immutable deployed OCI digest (sha256:...)
        required: true
      production_health_url:
        description: Read-only production health endpoint
        required: true

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  specification-review:
    environment: specification-review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env: {REVIEW_ENVIRONMENT: specification-review}
        run: bash scripts/quality/write-verification-review-receipt.sh specification tmp/reviews/specification.json
      - uses: actions/upload-artifact@v4
        with: {name: release-specification-review, path: tmp/reviews/specification.json, retention-days: 90}

  code-quality-review:
    environment: code-quality-review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env: {REVIEW_ENVIRONMENT: code-quality-review}
        run: bash scripts/quality/write-verification-review-receipt.sh code-quality tmp/reviews/code-quality.json
      - uses: actions/upload-artifact@v4
        with: {name: release-code-quality-review, path: tmp/reviews/code-quality.json, retention-days: 90}

  release-review:
    environment: release-evidence-review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env: {REVIEW_ENVIRONMENT: release-evidence-review}
        run: bash scripts/quality/write-verification-review-receipt.sh release-evidence tmp/reviews/release-evidence.json
      - uses: actions/upload-artifact@v4
        with: {name: release-evidence-review-receipt, path: tmp/reviews/release-evidence.json, retention-days: 90}

  release-soak:
    needs: [specification-review, code-quality-review, release-review]
    environment: production-verification
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      STRATUM_TEST_POSTGRES_URL: postgres://stratum:stratum@127.0.0.1:5432/stratum_e2e?sslmode=disable
      REDIS_URL: redis://127.0.0.1:6379
      NATS_URL: nats://127.0.0.1:4222
      MILVUS_HOST: 127.0.0.1
      MILVUS_PORT: "19530"
      STATEFUL_E2E_INFRA_UP_COMMAND: bash scripts/e2e/ci-infra-up.sh
      STATEFUL_E2E_INFRA_DOWN_COMMAND: bash scripts/e2e/ci-infra-down.sh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: "1.25", cache: true}
      - uses: actions/setup-node@v4
        with: {node-version: "22", cache: npm, cache-dependency-path: web/package-lock.json}
      - run: npm ci --prefix web && npx --prefix web playwright install --with-deps chromium
      - name: Validate immutable release subject
        env: {ARTIFACT_DIGEST: '${{ inputs.artifact_digest }}'}
        run: |
          [[ "$ARTIFACT_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
      - name: Run 3600-second release soak
        run: make e2e-system-release-soak
      - name: Verify deployed production health
        env: {PRODUCTION_HEALTH_URL: '${{ inputs.production_health_url }}'}
        run: curl --proto '=https' --tlsv1.2 --fail --silent --show-error "$PRODUCTION_HEALTH_URL" >/dev/null
      - id: evidence
        run: |
          digest=$(go run ./cmd/e2e-attestation digest --root . --ref HEAD)
          path=$(find test/e2e/attestations -type f -name "$digest.json" | sort | tail -1)
          test -n "$path"
          echo "path=$path" >> "$GITHUB_OUTPUT"
      - id: evidence-attest
        uses: actions/attest@v4
        with: {subject-path: '${{ steps.evidence.outputs.path }}'}
      - name: Attest promoted artifact digest
        uses: actions/attest@v4
        with:
          subject-name: stratum-release
          subject-digest: ${{ inputs.artifact_digest }}
      - name: Build signed verification receipt
        env:
          GH_TOKEN: ${{ github.token }}
          EVIDENCE_PATH: ${{ steps.evidence.outputs.path }}
          BUNDLE_PATH: ${{ steps.evidence-attest.outputs.bundle-path }}
        run: |
          gh attestation verify "$EVIDENCE_PATH" --repo "$GITHUB_REPOSITORY"
          subject="sha256:$(sha256sum "$EVIDENCE_PATH" | cut -d' ' -f1)"
          jq -n --arg commit "$GITHUB_SHA" --arg bundle "$BUNDLE_PATH" --arg subject "$subject" \
            '{verified:true,issuer:"github-actions-sigstore",commit:$commit,bundle:$bundle,subject_digest:$subject}' \
            > tmp/signature-receipt.json
      - uses: actions/download-artifact@v4
        with: {pattern: 'release-*-review*', path: tmp/test-verification/reviews, merge-multiple: true}
      - name: Produce R4 completion report
        env:
          TEST_VERIFY_RELEASE_INTENT: "true"
          TEST_VERIFY_SIGNATURE_RECEIPT: tmp/signature-receipt.json
          TEST_VERIFY_RELEASE_ARTIFACTS_JSON: '["${{ inputs.artifact_digest }}"]'
          TEST_VERIFY_REQUIRE_ACCEPTED: "true"
        run: make test-verify-plan test-verify-report
      - uses: actions/upload-artifact@v4
        with:
          name: release-verification
          path: |
            test/e2e/attestations/
            tmp/test-verification/completion-report.json
            tmp/signature-receipt.json
          retention-days: 90
