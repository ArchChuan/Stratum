name: Release Verification

on:
  workflow_dispatch:
    inputs:
      deployment_run_id:
        description: Successful Build and Deploy workflow run ID
        required: true

permissions:
  actions: read
  contents: read
  id-token: write
  attestations: write

jobs:
  specification-review:
    environment: specification-review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env: {REVIEW_ENVIRONMENT: specification-review}
        run: bash scripts/quality/write-verification-review-receipt.sh specification tmp/reviews/specification.json
      - uses: actions/upload-artifact@v4
        with: {name: release-specification-review, path: tmp/reviews/specification.json, retention-days: 90}

  code-quality-review:
    environment: code-quality-review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env: {REVIEW_ENVIRONMENT: code-quality-review}
        run: bash scripts/quality/write-verification-review-receipt.sh code-quality tmp/reviews/code-quality.json
      - uses: actions/upload-artifact@v4
        with: {name: release-code-quality-review, path: tmp/reviews/code-quality.json, retention-days: 90}

  release-review:
    environment: release-evidence-review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env: {REVIEW_ENVIRONMENT: release-evidence-review}
        run: bash scripts/quality/write-verification-review-receipt.sh release-evidence tmp/reviews/release-evidence.json
      - uses: actions/upload-artifact@v4
        with: {name: release-evidence-review-receipt, path: tmp/reviews/release-evidence.json, retention-days: 90}

  release-soak:
    needs: [specification-review, code-quality-review, release-review]
    environment: production-verification
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      STRATUM_TEST_POSTGRES_URL: postgres://stratum:stratum@127.0.0.1:5432/stratum_e2e?sslmode=disable
      REDIS_URL: redis://127.0.0.1:6379
      NATS_URL: nats://127.0.0.1:4222
      MILVUS_HOST: 127.0.0.1
      MILVUS_PORT: "19530"
      STATEFUL_E2E_INFRA_UP_COMMAND: bash scripts/e2e/ci-infra-up.sh
      STATEFUL_E2E_INFRA_DOWN_COMMAND: bash scripts/e2e/ci-infra-down.sh
      PUBLIC_BASE_URL: ${{ vars.PUBLIC_BASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: "1.25", cache: true}
      - uses: actions/setup-node@v4
        with: {node-version: "22", cache: npm, cache-dependency-path: web/package-lock.json}
      - run: npm ci --prefix web && npx --prefix web playwright install --with-deps chromium
      - name: Generate release verification plan
        env: {TEST_VERIFY_RELEASE_INTENT: "true"}
        run: make test-verify-plan
      - name: Run planned non-release checks
        run: |
          make risk-guardrails code-quality
          go vet ./...
          go test -short ./...
          go test ./... -count=1
          make contract-test fe-lint fe-build
          make e2e-system-short
      - name: Download deployment evidence
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOYMENT_RUN_ID: ${{ inputs.deployment_run_id }}
        run: |
          run_json=$(gh run view "$DEPLOYMENT_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --json workflowName,conclusion,headSha,headBranch)
          jq -e --arg sha "$GITHUB_SHA" '
            .workflowName == "Build and Deploy" and
            .conclusion == "success" and
            .headSha == $sha and
            .headBranch == "main"
          ' <<<"$run_json" >/dev/null
          gh run download "$DEPLOYMENT_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name deployment-evidence --dir tmp/deployment-evidence
      - name: Verify deployment evidence
        run: |
          test "$GITHUB_REF" = refs/heads/main
          receipt=tmp/deployment-evidence/deployment-receipt.json
          bundle=$(find tmp/deployment-evidence -type f ! -name deployment-receipt.json | head -1)
          test -f "$receipt" && test -f "$bundle"
          test "$(jq -er .commit "$receipt")" = "$GITHUB_SHA"
          gh attestation verify "$receipt" --bundle "$bundle" --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "github.com/$GITHUB_REPOSITORY/.github/workflows/deploy.yml" \
            --source-digest "$GITHUB_SHA" --source-ref refs/heads/main \
            --cert-oidc-issuer https://token.actions.githubusercontent.com
          jq -e 'all(.images[]; test("@sha256:[0-9a-f]{64}$"))' "$receipt" >/dev/null
      - name: Run 3600-second release soak
        run: make e2e-system-release-soak
      - name: Verify deployed production health
        run: curl --proto '=https' --tlsv1.2 --fail --silent --show-error "$PUBLIC_BASE_URL/api/health" >/dev/null
      - id: evidence
        run: |
          digest=$(go run ./cmd/e2e-attestation digest --root . --ref HEAD)
          path=$(find test/e2e/attestations -type f -name "$digest.json" | sort | tail -1)
          test -n "$path"
          echo "path=$path" >> "$GITHUB_OUTPUT"
      - id: evidence-attest
        uses: actions/attest@v4
        with: {subject-path: '${{ steps.evidence.outputs.path }}'}
      - name: Build signed verification receipt
        env:
          GH_TOKEN: ${{ github.token }}
          EVIDENCE_PATH: ${{ steps.evidence.outputs.path }}
          BUNDLE_PATH: ${{ steps.evidence-attest.outputs.bundle-path }}
        run: |
          gh attestation verify "$EVIDENCE_PATH" --bundle "$BUNDLE_PATH" --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "github.com/$GITHUB_REPOSITORY/.github/workflows/release-verification.yml" \
            --source-digest "$GITHUB_SHA" --source-ref "$GITHUB_REF" \
            --cert-oidc-issuer https://token.actions.githubusercontent.com
          jq -n --arg bundle "$BUNDLE_PATH" --arg source_ref "$GITHUB_REF" \
            '{bundle:$bundle,source_ref:$source_ref}' \
            > tmp/signature-receipt.json
      - uses: actions/download-artifact@v4
        with: {pattern: 'release-*-review*', path: tmp/test-verification/reviews, merge-multiple: true}
      - name: Record commit-bound planned checks
        run: bash scripts/quality/write-verification-check-receipt.sh \
          tmp/test-verification/plan.json tmp/test-verification/checks.json \
          static unit integration contract e2e-short domain-failure-paths e2e-soak \
          specification-review code-quality-review release-soak deployment production-verification
      - name: Produce R4 completion report
        env:
          TEST_VERIFY_RELEASE_INTENT: "true"
          TEST_VERIFY_SIGNATURE_RECEIPT: tmp/signature-receipt.json
          TEST_VERIFY_CHECK_RECEIPT: tmp/test-verification/checks.json
          TEST_VERIFY_REQUIRE_ACCEPTED: "true"
        run: |
          artifacts=$(jq -c '[.images[] | capture("@(?<digest>sha256:[0-9a-f]{64})$").digest]' \
            tmp/deployment-evidence/deployment-receipt.json)
          TEST_VERIFY_RELEASE_ARTIFACTS_JSON="$artifacts" make test-verify-report
      - uses: actions/upload-artifact@v4
        with:
          name: release-verification
          path: |
            test/e2e/attestations/
            tmp/test-verification/completion-report.json
            tmp/test-verification/checks.json
            tmp/signature-receipt.json
          retention-days: 90
