# Prometheus 配置文件

global:
  scrape_interval: 30s  # 默认抓取间隔
  evaluation_interval: 15s  # 规则评估间隔
  external_labels:
    cluster: 'stratum-production'
    environment: 'production'

# 告警管理器配置
alerting:
  alertmanagers:
    - static_configs:
        - targets: []

# 规则文件（容器内挂载 monitoring/local/rules，由 render-monitoring-rules.sh local 渲染）
rule_files:
  - "/etc/prometheus/rules/*.yml"

# 抓取配置
scrape_configs:
  # Prometheus 自监控
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Stratum AI 应用指标
  - job_name: 'stratum-ai'
    static_configs:
      - targets: ['host.docker.internal:8080']
    metrics_path: '/metrics'
    scrape_interval: 15s
    # 注入与远端 ServiceMonitor 一致的标签，使共享规则 expr 的
    # namespace/service/endpoint 选择器在本地同样匹配
    relabel_configs:
      - target_label: namespace
        replacement: stratum
      - target_label: service
        replacement: stratum
      - target_label: endpoint
        replacement: http

  # OTEL Collector 指标
  - job_name: 'otel-collector'
    static_configs:
      - targets: ['otel-collector:8888']
    metrics_path: '/metrics'

  # NATS 指标
  - job_name: 'nats'
    static_configs:
      - targets: ['nats:8222']
    metrics_path: '/metrics'

  # Milvus 指标
  - job_name: 'milvus'
    static_configs:
      - targets: ['milvus:9091']
    metrics_path: '/metrics'
    scrape_interval: 60s

  # MinIO 指标
  - job_name: 'minio'
    static_configs:
      - targets: ['minio:9000']
    metrics_path: '/minio/v2/metrics/cluster'
    scrape_interval: 60s

  # Node Exporter（可选）
  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']
    scrape_interval: 15s
