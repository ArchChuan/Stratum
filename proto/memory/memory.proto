syntax = "proto3";

package stratum.memory;

import "google/protobuf/timestamp.proto";

message MemoryFactResponse {
  string id = 1;
  string scope = 2;
  string content = 3;
  double importance = 4;
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp updated_at = 6;
}

message MemorySessionsResponse {
  repeated string sessions = 1;
}

message MemorySummaryResponse {
  string summary = 1;
}

// MemoryStatsResponse 统计当前用户的记忆（scope='user' AND status='active'，
// 与 ListUserFacts/ListUserEntities 同口径）。
message MemoryStatsResponse {
  int64 memory_count = 1;
  int64 entity_count = 2;
  // 租户是否已配置可用嵌入模型（无可用模型时 false，前端展示健康提示）。
  bool embed_model_configured = 3;
}

// MemoryEntityResponse 是用户侧只读的轻量话题标签。
message MemoryEntityResponse {
  string id = 1;
  string name = 2;
  string entity_type = 3;
  int64 fact_count = 4;
  google.protobuf.Timestamp last_seen_at = 5;
}

message ListMemoryEntitiesResponse {
  repeated MemoryEntityResponse entities = 1;
  int64 total = 2;
}

// MemoryMigrationResponse 记忆嵌入模型平滑迁移记录（P5 确认制切换），
// 状态机快照 {from, to, status, progress, total_facts}。
message MemoryMigrationResponse {
  int64 id = 1;
  string from_model = 2;
  string to_model = 3;
  // status: migrating|done|failed|canceled。
  string status = 4;
  // progress 已回填事实数；total_facts 为迁移开始时 memory_facts 行数快照，
  // 分母不随迁移期间写入漂移。
  int32 progress = 5;
  int32 total_facts = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
}

// MemoryMigrationCostResponse 迁移成本预览：存量已提取事实条数 + 预计回填时长（秒）。
message MemoryMigrationCostResponse {
  int64 fact_count = 1;
  int64 estimated_seconds = 2;
}

// StartMemoryMigrationRequest 确认制启动 A→B 迁移；from 取租户当前生效模型。
message StartMemoryMigrationRequest {
  string to_model = 1;
}
