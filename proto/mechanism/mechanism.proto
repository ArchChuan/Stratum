syntax = "proto3";

package stratum.mechanism;

import "google/protobuf/timestamp.proto";

// mechanism 承载机制基线（model_profiles）管理面契约：模型族档案的建档、
// 更新与生效状态。管理面依附默认租户（tenant_default）迭代，消费路径
// （memory 管线/压缩链路）经 BaselineResolver 透明取用，租户零感知。

message ProfileResponse {
  string id = 1;
  string family_key = 2;
  string display_name = 3;
  repeated string family_prefixes = 4;
  // @omitempty
  string fingerprint = 5;
  int32 version = 6;
  // @omitempty
  string status = 7;
  // @omitempty
  string created_by = 8;
  // @omitempty
  google.protobuf.Timestamp created_at = 9;
  // @omitempty
  google.protobuf.Timestamp updated_at = 10;
  // 机制基线：prompt 六键 / 管线模型引用（召回参数待接线，当前双向 nil）。
  ProfileBaselineResponse baseline = 11;
}

message ProfileBaselineResponse {
  // @omitempty
  string memory_extraction = 1;
  // @omitempty
  string memory_summary = 2;
  // @omitempty
  string memory_enrichment = 3;
  // @omitempty
  string memory_summarize = 4;
  // @omitempty
  string memory_supersede = 5;
  // @omitempty
  string compaction = 6;
  // @omitempty
  string enrich_model = 7;
  // @omitempty
  string summary_model = 8;
}

message ListProfilesResponse {
  repeated ProfileResponse profiles = 1;
}

message UpsertProfileRequest {
  // @binding: required,max=64
  string family_key = 1;
  // @binding: max=128
  string display_name = 2;
  // @binding: required,min=1,max=32,dive,required,max=100
  repeated string family_prefixes = 3;
  // @binding: omitempty,oneof=active draft
  string status = 4;
  ProfileBaselineRequest baseline = 5;
}

message ProfileBaselineRequest {
  string memory_extraction = 1;
  string memory_summary = 2;
  string memory_enrichment = 3;
  string memory_summarize = 4;
  string memory_supersede = 5;
  string compaction = 6;
  string enrich_model = 7;
  string summary_model = 8;
}

// —— 评测矩阵工作台（阶段3，机制基线设计 §5）——
// 基准集 × 模型档案矩阵评测：报告含多维指标（fidelity/cost/perf）与
// 帕累托前沿标注；触发走 job 异步执行；采纳 = draft → active 两态发布。

message BenchmarkSuiteResponse {
  string id = 1;
  string name = 2;
  string description = 3;
  // @omitempty
  string active_revision = 4;
  int32 case_count = 5;
}

message MatrixCellResponse {
  string family_key = 1;
  string display_name = 2;
  string status = 3;
  // @omitempty
  string fingerprint = 4;
  int32 version = 5;
  // @omitempty
  string enrich_model = 6;
  // @omitempty
  string summary_model = 7;
  // @omitempty
  string run_id = 8;
  bool passed = 9;
  double pass_rate = 10;
  double total_cost = 11;
  double avg_latency = 12;
  int32 total_cases = 13;
  bool frontier = 14;
}

message MatrixReportResponse {
  repeated BenchmarkSuiteResponse suites = 1;
  repeated MatrixCellResponse cells = 2;
  repeated string frontier_keys = 3;
}

message RunMatrixResponse {
  string suite_revision_id = 1;
  int32 triggered_count = 2;
}

message AdoptProfileRequest {
  // @binding: required,max=64
  string family_key = 1;
}
