syntax = "proto3";

package stratum.skill;

import "google/protobuf/struct.proto";

message CreateSkillRequest {
  // @binding: required
  string name = 1;
  // @binding: required
  string description = 2;
  // @binding: required
  string instructions = 3;
  // Editors grants additional members update rights, persisted with the skill.
  repeated string editors = 8;
}

message UpdateSkillDraftRequest {
  string name = 1;
  string description = 2;
  string instructions = 3;
}

message SkillWorkspaceResponse {
  repeated string editors = 1;
  SkillProductResponse skill = 2;
  SkillRevisionResponse draft = 3;
}

message SkillProductResponse {
  string id = 1;
  string name = 2;
  string description = 3;
  string status = 4;
  // @omitempty
  string activeRevisionId = 5;
  // @omitempty
  string draftRevisionId = 6;
  // isSystem 标记系统内置 skill(builtin: 前缀),供前端按普通 agent / 系统助手条件过滤。
  bool isSystem = 7;
}

message SkillRevisionResponse {
  string id = 1;
  string skillId = 2;
  // @omitempty
  int32 revisionNo = 3;
  string status = 4;
  string name = 5;
  string description = 6;
  string instructions = 7;
  // @omitempty
  google.protobuf.Struct publishChecks = 9;
}

message ErrorResponse {
  int32 code = 1;
  string message = 2;
}
