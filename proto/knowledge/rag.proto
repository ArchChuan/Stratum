syntax = "proto3";

package stratum.knowledge;

import "google/protobuf/timestamp.proto";
import "google/protobuf/struct.proto";

message WorkspaceConfig {
  string embedding_model = 1;
  string chunking_strategy = 2;
  int32 chunk_size = 3;
  int32 chunk_overlap = 4;
  // query_mode 不加 binding：AllowedQueryModes={vector,graph,hybrid} 与前端
  // 表单/QueryRequest.mode 的 {vector,keyword,hybrid} 存在既有枚举漂移，由
  // ErrInvalidQueryMode 兜底，不在此处固化任一错误枚举。
  string query_mode = 5;
  // @binding: omitempty,min=1,max=20
  int32 top_k = 6;
  // reranking 不加 binding：值含 "" 与外部任意 provider 身份，oneof 无法表达。
  string reranking = 7; // "" / "builtin-score-v1" / "provider:model"
  // @binding: omitempty,min=0,max=1
  float score_threshold = 8; // float32:映射表 float → float32
  // @binding: omitempty,min=0,max=20
  int32 rerank_top_k = 9; // 0 = use TopK
  // rerank_model: builtin-score-v1 的 LLM 语义重排模型（workspace 显式配置）。
  // judge_model: 证据充分性判断模型；空 = judge 门关闭。
  string rerank_model = 10;
  string judge_model = 11;
  // 评分指令附加段：rerank_scoring_instructions 供内置重排（builtin-score-v1）、
  // judge_scoring_instructions 供证据充分性 judge 使用。空 = 使用代码内置评分
  // prompt；JSON 输出结构固定不可编辑。长度上限由后端 domain Validate 校验，
  // 不加 binding。
  string rerank_scoring_instructions = 12;
  string judge_scoring_instructions = 13;
}

message QueryRequest {
  // @binding: required,max=4096
  string question = 1;
  // @binding: required
  string workspace = 2;
  // @binding: required,oneof=vector keyword hybrid
  string mode = 3;
  // @binding: omitempty,min=1,max=20
  int32 topK = 4;
}

message CreateWorkspaceRequest {
  // @binding: required
  string name = 1;
  string description = 2;
  WorkspaceConfig config = 3;
  repeated string editors = 4; // 每个 id 须持 admin/owner 角色
}

message UpdateWorkspaceRequest {
  optional string name = 1;
  optional string description = 2;
  optional WorkspaceConfig config = 3;
}

message IngestDocumentRequest {
  // @binding: required
  string workspace = 1;
  // @binding: required
  bytes document_data = 2;
  // @binding: required
  string filename = 3;
  // @binding: required
  string document_id = 4;
  // Document-level access whitelist; both empty => unrestricted.
  repeated string allowed_user_ids = 5;
  repeated string allowed_role_ids = 6;
}

// DocumentAccessRequest replaces the document-level access whitelist of a
// single document (PUT /knowledge/workspaces/:name/documents/:documentID/access).
message DocumentAccessRequest {
  // @binding: required
  string workspace = 1;
  // @binding: required
  string document_id = 2;
  repeated string allowed_user_ids = 3;
  repeated string allowed_role_ids = 4;
}

// DocumentAccessResponse echoes the applied whitelist.
message DocumentAccessResponse {
  repeated string allowed_user_ids = 1;
  repeated string allowed_role_ids = 2;
}

// ChunkSegment is one ordered content unit of a previewed document.
message ChunkSegment {
  string chunk_id = 1;
  int64 index = 2;
  string content = 3;
  string parent_content = 4; // non-empty when the chunk references a Parent-Child parent
}

// PreviewDocumentResponse is the chunk-reassembled content of a document
// (GET /knowledge/workspaces/:name/documents/:documentID/preview). Raw
// document text is not stored, so previews rebuild it from ordered chunks.
message PreviewDocumentResponse {
  string workspace = 1;
  string document_id = 2;
  string document_title = 3; // source file name of the doc
  int32 chunk_count = 4;
  repeated ChunkSegment segments = 5;
}

message WorkspaceListItem {
  string id = 1;
  string name = 2;
  string description = 3;
  WorkspaceConfig config = 4;
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp updated_at = 6;
  // Editors is the current granted editor set, for form prefill.
  repeated string editors = 7;
  // management_mode 历史兼容透传字段已删除（平台托管 workspace 已普通化）。
  reserved 8;
}
