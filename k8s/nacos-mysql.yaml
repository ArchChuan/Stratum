---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nacos-mysql-data
  namespace: stratum
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nacos-mysql
  namespace: stratum
spec:
  replicas: 1
  selector:
    matchLabels: {app: nacos-mysql}
  template:
    metadata:
      labels: {app: nacos-mysql}
    spec:
      containers:
        - name: mysql
          image: mysql:8.4
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef: {name: stratum-secrets, key: NACOS_MYSQL_PASSWORD}
            - name: MYSQL_DATABASE
              value: nacos
          ports: [{containerPort: 3306}]
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: nacos-mysql-data
---
apiVersion: v1
kind: Service
metadata:
  name: nacos-mysql
  namespace: stratum
spec:
  selector: {app: nacos-mysql}
  ports:
    - {port: 3306, targetPort: 3306}
