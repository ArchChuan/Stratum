---
# Jaeger all-in-one (badger persistent storage) — monitoring namespace
# Traces survive pod restarts and redeploys via the jaeger-data PVC.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  namespace: monitoring
  labels:
    app: jaeger
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jaeger
  template:
    metadata:
      labels:
        app: jaeger
    spec:
      containers:
      - name: jaeger
        image: jaegertracing/all-in-one:1.58
        args:
          - --query.base-path=/jaeger
          # Badger is Jaeger's embedded persistent store; ephemeral=false keeps
          # data on the jaeger-data PVC across restarts.
          - --badger.ephemeral=false
          - --badger.directory-key=/badger/key
          - --badger.directory-value=/badger/data
          - --badger.consistency=true
          # Admin HTTP server serves /metrics for Prometheus scraping (default
          # port is 14269 but we pin it so the ServiceMonitor target is stable).
          - --admin.http.host-port=:14269
        env:
        - name: SPAN_STORAGE_TYPE
          value: badger
        - name: COLLECTOR_OTLP_ENABLED
          value: "true"
        ports:
        - name: ui
          containerPort: 16686
        - name: otlp-grpc
          containerPort: 4317
        - name: otlp-http
          containerPort: 4318
        - name: admin
          containerPort: 14269
        volumeMounts:
        - name: data
          mountPath: /badger
        resources:
          requests:
            memory: 256Mi
            cpu: 50m
          limits:
            memory: 1Gi
            cpu: 500m
        readinessProbe:
          httpGet:
            path: /jaeger/
            port: 16686
          initialDelaySeconds: 5
          periodSeconds: 10
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: jaeger-data
---
# Jaeger trace storage — survives pod restarts and re-deploys
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jaeger-data
  namespace: monitoring
  labels:
    app.kubernetes.io/component: tracing
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger
  namespace: monitoring
  labels:
    app: jaeger
spec:
  selector:
    app: jaeger
  ports:
  - name: ui
    port: 16686
    targetPort: 16686
  - name: otlp-grpc
    port: 4317
    targetPort: 4317
  - name: otlp-http
    port: 4318
    targetPort: 4318
  # Prometheus scrapes jaeger /metrics here (admin HTTP server).
  - name: admin
    port: 14269
    targetPort: 14269
---
# Traefik ingress for Jaeger UI at /jaeger
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jaeger
  namespace: monitoring
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: "web"
spec:
  ingressClassName: traefik
  rules:
  - http:
      paths:
      - path: /jaeger
        pathType: Prefix
        backend:
          service:
            name: jaeger
            port:
              number: 16686
---
# OTEL Collector config — stratum namespace
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  namespace: stratum
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318

    processors:
      memory_limiter:
        check_interval: 5s
        limit_mib: 256
        spike_limit_mib: 64

      resource:
        attributes:
          - key: environment
            value: demo
            action: upsert

      tail_sampling:
        decision_wait: 10s
        policies:
          # agent.execute 根 span（SDK 打 stratum.agent.execute=true）全链路保，
          # 覆盖非 HTTP 触发（workflow/scheduler/NATS/MCP），补 chat-always 的
          # http.route 盲区。与 SDK agentSampler 配合，两端缺一不可。
          - name: agent-always
            type: string_attribute
            string_attribute:
              key: stratum.agent.execute
              values: ["true"]
          - name: evaluation-always
            type: string_attribute
            string_attribute:
              key: stratum.evaluation
              values: ["true"]
          - name: experiment-always
            type: string_attribute
            string_attribute:
              key: stratum.experiment.id
              values: [".+"]
              enabled_regex_matching: true
          - name: security-always
            type: string_attribute
            string_attribute:
              key: stratum.security_violation
              values: ["true"]
          # Core conversation chain — always sample
          - name: chat-always
            type: string_attribute
            string_attribute:
              key: http.route
              values:
                - /agents/:id/execute
                - /agents/:id/execute/stream
                - /conversations/:convID/messages
              enabled_regex_matching: false
          - name: error-policy
            type: status_code
            status_code:
              status_codes: [ERROR]
          - name: slow-policy
            type: latency
            latency:
              threshold_ms: 1000
          - name: default-policy
            type: probabilistic
            probabilistic:
              sampling_percentage: 10

      batch:
        timeout: 1s
        send_batch_size: 512

    exporters:
      otlp/jaeger:
        endpoint: jaeger.monitoring.svc.cluster.local:4317
        tls:
          insecure: true
        # Without a sending queue and retry, a transient Jaeger outage drops
        # the whole export batch silently (observed: a 19.8s agent trace missing
        # from Jaeger while neighbouring traces survived). bounded retry drains
        # the queue after recovery instead of discarding spans.
        sending_queue:
          enabled: true
          queue_size: 1024
        retry_on_failure:
          enabled: true
          initial_interval: 1s
          max_interval: 30s
          max_elapsed_time: 60s
      otlphttp/opik:
        endpoint: ${env:OPIK_OTLP_ENDPOINT}
        headers:
          projectName: ${env:OPIK_PROJECT}
          Comet-Workspace: ${env:OPIK_WORKSPACE}
          Authorization: ${env:OPIK_API_KEY}
      debug:
        verbosity: basic
        sampling_initial: 2
        sampling_thereafter: 100

    extensions:
      health_check:
        endpoint: 0.0.0.0:13133

    service:
      extensions: [health_check]
      telemetry:
        metrics:
          # Expose the collector's own /metrics for Prometheus scraping.
          address: 0.0.0.0:8888
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, resource, tail_sampling, batch]
          exporters: [otlp/jaeger, otlphttp/opik, debug]
---
# OTEL Collector Deployment — stratum namespace
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  namespace: stratum
  labels:
    app: otel-collector
spec:
  replicas: 1
  selector:
    matchLabels:
      app: otel-collector
  template:
    metadata:
      labels:
        app: otel-collector
    spec:
      containers:
      - name: otel-collector
        image: otel/opentelemetry-collector-contrib:0.102.0
        args:
          - --config=/conf/config.yaml
        env:
        - name: OPIK_OTLP_ENDPOINT
          valueFrom:
            configMapKeyRef:
              name: stratum-config
              key: OPIK_OTLP_ENDPOINT
        - name: OPIK_PROJECT
          valueFrom:
            configMapKeyRef:
              name: stratum-config
              key: OPIK_PROJECT
        - name: OPIK_WORKSPACE
          valueFrom:
            configMapKeyRef:
              name: stratum-config
              key: OPIK_WORKSPACE
        - name: OPIK_API_KEY
          valueFrom:
            secretKeyRef:
              name: stratum-secrets
              key: OPIK_API_KEY
              optional: true
        ports:
        - name: otlp-grpc
          containerPort: 4317
        - name: otlp-http
          containerPort: 4318
        - name: health
          containerPort: 13133
        - name: metrics
          containerPort: 8888
        volumeMounts:
        - name: config
          mountPath: /conf
        resources:
          requests:
            memory: 64Mi
            cpu: 50m
          limits:
            memory: 256Mi
            cpu: 200m
        livenessProbe:
          httpGet:
            path: /
            port: 13133
          initialDelaySeconds: 10
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /
            port: 13133
          initialDelaySeconds: 5
          periodSeconds: 10
      volumes:
      - name: config
        configMap:
          name: otel-collector-config
---
# Service named exactly as OTEL_EXPORTER_OTLP_ENDPOINT expects
apiVersion: v1
kind: Service
metadata:
  name: stratum-otel-collector
  namespace: stratum
  labels:
    app: otel-collector
spec:
  selector:
    app: otel-collector
  ports:
  - name: otlp-grpc
    port: 4317
    targetPort: 4317
  - name: otlp-http
    port: 4318
    targetPort: 4318
  # Prometheus scrapes the collector's /metrics here (service telemetry).
  - name: metrics
    port: 8888
    targetPort: 8888
