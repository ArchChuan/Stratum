---
apiVersion: v1
kind: Secret
metadata:
  name: stratum-secrets
  namespace: stratum
type: Opaque
stringData:
  NEO4J_PASSWORD: "replace-with-neo4j-password"
  OPENAI_API_KEY: "replace-with-openai-api-key"
  JWT_SECRET: "replace-with-jwt-secret"
  MCP_SECRET_KEY: "replace-with-mcp-secret-key"
  NACOS_MYSQL_PASSWORD: "replace-with-nacos-mysql-password"
  NACOS_AUTH_IDENTITY_KEY: "replace-with-nacos-auth-identity-key"
  NACOS_AUTH_IDENTITY_VALUE: "replace-with-nacos-auth-identity-value"
  NACOS_AUTH_TOKEN: "replace-with-nacos-auth-token"
  NACOS_PASSWORD: "<nacos 登录密码>"
