apiVersion: v1
kind: ConfigMap
metadata:
  name: opik-otel-collector-config
  namespace: stratum
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
    processors:
      memory_limiter:
        check_interval: 5s
        limit_mib: 128
        spike_limit_mib: 32
      batch:
        timeout: 1s
        send_batch_size: 256
    exporters:
      otlphttp/opik:
        endpoint: http://opik-backend.opik.svc.cluster.local:8080/v1/private/otel
        headers:
          projectName: stratum
          Comet-Workspace: default
    extensions:
      health_check:
        endpoint: 0.0.0.0:13133
    service:
      extensions: [health_check]
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [otlphttp/opik]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opik-otel-collector
  namespace: stratum
  labels:
    app.kubernetes.io/name: opik-otel-collector
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: opik-otel-collector
  template:
    metadata:
      labels:
        app.kubernetes.io/name: opik-otel-collector
    spec:
      containers:
        - name: collector
          image: otel/opentelemetry-collector-contrib:0.133.0
          args: ["--config=/conf/config.yaml"]
          ports:
            - name: otlp-grpc
              containerPort: 4317
            - name: otlp-http
              containerPort: 4318
            - name: health
              containerPort: 13133
          volumeMounts:
            - name: config
              mountPath: /conf
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /
              port: health
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: health
            periodSeconds: 15
      volumes:
        - name: config
          configMap:
            name: opik-otel-collector-config
---
apiVersion: v1
kind: Service
metadata:
  name: stratum-otel-collector
  namespace: stratum
  labels:
    app.kubernetes.io/name: opik-otel-collector
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: opik-otel-collector
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: otlp-grpc
    - name: otlp-http
      port: 4318
      targetPort: otlp-http
