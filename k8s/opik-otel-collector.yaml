apiVersion: v1
kind: ConfigMap
metadata:
  name: opik-otel-collector-config
  namespace: stratum
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
    processors:
      memory_limiter:
        check_interval: 5s
        limit_mib: 128
        spike_limit_mib: 32
      filter/drop_probes:
        error_mode: ignore
        traces:
          span:
            - 'attributes["http.route"] == "/readyz"'
            - 'attributes["http.route"] == "/livez"'
            - 'attributes["http.route"] == "/metrics"'
            - 'attributes["http.route"] == "/health"'
            - 'attributes["http.route"] == "/healthz"'
      resource:
        attributes:
          - key: environment
            value: demo
            action: upsert
      tail_sampling:
        decision_wait: 10s
        policies:
          # agent.execute 根 span（SDK 打 stratum.agent.execute=true）全链路保，
          # 覆盖非 HTTP 触发路径，补 chat-always 的 http.route 盲区。
          - name: agent-always
            type: string_attribute
            string_attribute:
              key: stratum.agent.execute
              values: ["true"]
          - name: evaluation-always
            type: string_attribute
            string_attribute:
              key: stratum.evaluation
              values: ["true"]
          - name: experiment-always
            type: string_attribute
            string_attribute:
              key: stratum.experiment.id
              values: [".+"]
              enabled_regex_matching: true
          - name: security-always
            type: string_attribute
            string_attribute:
              key: stratum.security_violation
              values: ["true"]
          - name: chat-always
            type: string_attribute
            string_attribute:
              key: http.route
              values:
                - /agents/:id/execute
                - /agents/:id/execute/stream
                - /conversations/:convID/messages
          - name: error-policy
            type: status_code
            status_code:
              status_codes: [ERROR]
          - name: slow-policy
            type: latency
            latency:
              threshold_ms: 1000
          - name: default-policy
            type: probabilistic
            probabilistic:
              sampling_percentage: 10
      batch:
        timeout: 1s
        send_batch_size: 256
    exporters:
      otlp/jaeger:
        endpoint: jaeger.monitoring.svc.cluster.local:4317
        tls:
          insecure: true
        retry_on_failure:
          enabled: true
          initial_interval: 1s
          max_interval: 30s
          max_elapsed_time: 5m
        sending_queue:
          enabled: true
          queue_size: 2048
          storage: file_storage/queue
      otlphttp/opik:
        endpoint: http://opik-backend.opik.svc.cluster.local:8080/v1/private/otel
        headers:
          projectName: stratum
          Comet-Workspace: default
        retry_on_failure:
          enabled: true
          initial_interval: 1s
          max_interval: 30s
          max_elapsed_time: 5m
        sending_queue:
          enabled: true
          queue_size: 2048
          storage: file_storage/queue
    extensions:
      health_check:
        endpoint: 0.0.0.0:13133
      file_storage/queue:
        directory: /var/lib/otelcol/queue
        create_directory: true
        fsync: true
    service:
      extensions: [health_check, file_storage/queue]
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, filter/drop_probes, resource, tail_sampling, batch]
          exporters: [otlp/jaeger, otlphttp/opik]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: opik-otel-collector-queue
  namespace: stratum
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opik-otel-collector
  namespace: stratum
  labels:
    app.kubernetes.io/name: opik-otel-collector
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: opik-otel-collector
  template:
    metadata:
      labels:
        app.kubernetes.io/name: opik-otel-collector
    spec:
      securityContext:
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: collector
          image: otel/opentelemetry-collector-contrib@sha256:98274b756324abdb2473fa0c898247a246091e861e61d1548f9be483198eecea
          args: ["--config=/conf/config.yaml"]
          ports:
            - name: otlp-grpc
              containerPort: 4317
            - name: otlp-http
              containerPort: 4318
            - name: health
              containerPort: 13133
          volumeMounts:
            - name: config
              mountPath: /conf
            - name: queue
              mountPath: /var/lib/otelcol/queue
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /
              port: health
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: health
            periodSeconds: 15
      volumes:
        - name: config
          configMap:
            name: opik-otel-collector-config
        - name: queue
          persistentVolumeClaim:
            claimName: opik-otel-collector-queue
---
apiVersion: v1
kind: Service
metadata:
  name: stratum-otel-collector
  namespace: stratum
  labels:
    app.kubernetes.io/name: opik-otel-collector
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: opik-otel-collector
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: otlp-grpc
    - name: otlp-http
      port: 4318
      targetPort: otlp-http
