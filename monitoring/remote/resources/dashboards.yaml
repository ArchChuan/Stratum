                  },
                  "expr": "stratum:http_5xx_ratio_by_path:ratio5m{service=\"stratum\",environment=\"remote-test\"}",
                  "legendFormat": "{{path}}",
                  "refId": "A"
                }
              ],
              "title": "5xx 比例",
              "type": "timeseries"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "fieldConfig": {
                "defaults": {
                  "min": 0,
                  "unit": "s"
                },
                "overrides": []
              },
              "gridPos": {
                "h": 8,
                "w": 8,
                "x": 16,
                "y": 0
              },
              "id": 3,
              "options": {
                "legend": {
                  "displayMode": "list",
                  "placement": "bottom"
                },
                "tooltip": {
                  "mode": "single"
                }
              },
              "targets": [
                {
                  "datasource": {
                    "type": "prometheus",
                    "uid": "prometheus"
                  },
                  "expr": "stratum:http_request_duration_seconds_by_path:p95_5m{service=\"stratum\",environment=\"remote-test\"}",
                  "legendFormat": "{{path}}",
