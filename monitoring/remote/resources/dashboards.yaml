                  "legendFormat": "Prometheus",
                  "refId": "B"
                },
                {
                  "datasource": {
                    "type": "prometheus",
                    "uid": "prometheus"
                  },
                  "expr": "up{namespace=\"monitoring\",service=\"kps-kube-prometheus-stack-alertmanager\",endpoint=\"http-web\"}",
                  "legendFormat": "Alertmanager",
                  "refId": "C"
                },
                {
                  "datasource": {
                    "type": "prometheus",
                    "uid": "prometheus"
