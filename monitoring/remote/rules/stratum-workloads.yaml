groups:
  - name: stratum-workloads
    rules:
      - alert: StratumNodeNotReady
        expr: max by (node) (kube_node_status_condition{condition="Ready",status="true"} == 0)
        for: 5m
        labels:
          severity: critical
          service: stratum
          environment: remote-test
          component: node
        annotations:
          summary: Stratum host node is not ready
          description: The node hosting the remote Stratum environment has not been ready for five minutes (current value {{ $value }}).
          dashboard_url: /d/stratum-resources
          runbook_url: /docs/operations/remote-monitoring-runbook.md#node-not-ready

      - alert: StratumPodRestartingFrequently
        expr: increase(kube_pod_container_status_restarts_total{namespace="stratum"}[10m]) > 3
        for: 2m
        labels:
          severity: warning
          service: stratum
          environment: remote-test
          component: workload
        annotations:
          summary: A Stratum container is restarting frequently
          description: The container restarted more than three times in ten minutes (current value {{ $value }}).
          dashboard_url: /d/stratum-resources
          runbook_url: /docs/operations/remote-monitoring-runbook.md#pod-restarting-frequently

      - alert: StratumPodCrashLooping
        expr: kube_pod_container_status_waiting_reason{namespace="stratum",reason="CrashLoopBackOff"} == 1
        for: 5m
        labels:
          severity: critical
          service: stratum
          environment: remote-test
          component: workload
        annotations:
          summary: A Stratum container is crash looping
          description: The container has remained in CrashLoopBackOff for five minutes (current value {{ $value }}).
          dashboard_url: /d/stratum-resources
          runbook_url: /docs/operations/remote-monitoring-runbook.md#pod-crash-looping

      - alert: StratumPodPendingTooLong
        expr: kube_pod_status_phase{namespace="stratum",phase="Pending"} == 1
        for: 15m
        labels:
          severity: warning
          service: stratum
          environment: remote-test
          component: workload
        annotations:
          summary: A Stratum pod has remained pending
          description: The pod has remained pending for fifteen minutes (current value {{ $value }}).
          dashboard_url: /d/stratum-resources
          runbook_url: /docs/operations/remote-monitoring-runbook.md#pod-pending-too-long
