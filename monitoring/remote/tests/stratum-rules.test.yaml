rule_files:
  - ../rules/stratum-availability.yaml
  - ../rules/stratum-http.yaml
  - ../rules/stratum-workloads.yaml
  - ../rules/stratum-capacity.yaml
  - ../rules/stratum-dependencies.yaml
  - ../rules/stratum-monitoring.yaml

evaluation_interval: 1m

tests:
  - name: workload rules expose node inhibition input and detect restart growth
    interval: 1m
    input_series:
      - series: 'kube_node_status_condition{node="remote-node",condition="Ready",status="true"}'
        values: '0x7'
      - series: 'kube_node_status_condition{node="foreign-node",condition="Ready",status="true"}'
        values: '0x7'
      - series: 'kube_pod_container_status_restarts_total{namespace="stratum",pod="stratum-abc",container="stratum"}'
        values: '0+1x7'
      - series: 'kube_pod_info{namespace="stratum",pod="stratum-abc",node="remote-node"}'
        values: '1x7'
      - series: 'kube_pod_owner{namespace="stratum",pod="stratum-abc",owner_kind="ReplicaSet",owner_name="stratum-abc-rs"}'
        values: '1x7'
      - series: 'kube_replicaset_owner{namespace="stratum",replicaset="stratum-abc-rs",owner_kind="Deployment",owner_name="stratum"}'
        values: '1x7'
    promql_expr_test:
      - expr: ALERTS{alertname="StratumNodeNotReady",alertstate="firing"}
        eval_time: 5m
        exp_samples:
          - labels: '{__name__="ALERTS",alertname="StratumNodeNotReady",alertstate="firing",component="node",environment="remote-test",node="remote-node",service="stratum",severity="critical"}'
            value: 1
      - expr: ALERTS{alertname="StratumPodRestartingFrequently",alertstate="firing"}
        eval_time: 6m
        exp_samples:
          - labels: '{__name__="ALERTS",alert_family="pod-health",alertname="StratumPodRestartingFrequently",alertstate="firing",component="workload",container="stratum",deployment="stratum",environment="remote-test",namespace="stratum",node="remote-node",pod="stratum-abc",service="stratum",severity="warning"}'
            value: 1
      - expr: stratum:kube_pod_owner:deployment{namespace="stratum",pod="stratum-abc"}
        eval_time: 1m
        exp_samples:
          - labels: '{__name__="stratum:kube_pod_owner:deployment",deployment="stratum",namespace="stratum",pod="stratum-abc"}'
            value: 1

  - name: workload rules detect crash loops and prolonged pending pods
    interval: 1m
    input_series:
      - series: 'kube_pod_container_status_waiting_reason{namespace="stratum",pod="crashing-pod",container="stratum",reason="CrashLoopBackOff"}'
        values: '1x18'
      - series: 'kube_pod_status_phase{namespace="stratum",pod="pending-pod",phase="Pending"}'
        values: '1x18'
      - series: 'kube_pod_info{namespace="stratum",pod="crashing-pod",node="remote-node"}'
        values: '1x18'
      - series: 'kube_pod_info{namespace="stratum",pod="pending-pod",node="remote-node"}'
        values: '1x18'
      - series: 'kube_pod_owner{namespace="stratum",pod="crashing-pod",owner_kind="ReplicaSet",owner_name="stratum-crash-rs"}'
        values: '1x18'
      - series: 'kube_replicaset_owner{namespace="stratum",replicaset="stratum-crash-rs",owner_kind="Deployment",owner_name="stratum"}'
        values: '1x18'
      - series: 'kube_pod_owner{namespace="stratum",pod="pending-pod",owner_kind="ReplicaSet",owner_name="frontend-pending-rs"}'
        values: '1x18'
      - series: 'kube_replicaset_owner{namespace="stratum",replicaset="frontend-pending-rs",owner_kind="Deployment",owner_name="stratum-frontend"}'
        values: '1x18'
      - series: 'kube_pod_container_status_waiting_reason{namespace="other",pod="foreign-pod",container="other",reason="CrashLoopBackOff"}'
        values: '1x18'
    promql_expr_test:
      - expr: ALERTS{alertname="StratumPodCrashLooping",alertstate="firing"}
        eval_time: 5m
        exp_samples:
          - labels: '{__name__="ALERTS",alert_family="pod-health",alertname="StratumPodCrashLooping",alertstate="firing",component="workload",container="stratum",deployment="stratum",environment="remote-test",namespace="stratum",node="remote-node",pod="crashing-pod",reason="CrashLoopBackOff",service="stratum",severity="critical"}'
            value: 1
      - expr: ALERTS{alertname="StratumPodPendingTooLong",alertstate="firing"}
        eval_time: 15m
        exp_samples:
          - labels: '{__name__="ALERTS",alertname="StratumPodPendingTooLong",alertstate="firing",component="workload",deployment="stratum-frontend",environment="remote-test",namespace="stratum",node="remote-node",phase="Pending",pod="pending-pod",service="stratum",severity="warning"}'
            value: 1

  - name: capacity rules detect low node memory and PVC thresholds
    interval: 1m
    input_series:
      - series: 'node_memory_MemAvailable_bytes{instance="remote-node"}'
        values: '90x17'
      - series: 'node_memory_MemTotal_bytes{instance="remote-node"}'
        values: '1000x17'
      - series: 'node_memory_MemAvailable_bytes{instance="foreign-instance"}'
        values: '10x17'
      - series: 'node_memory_MemTotal_bytes{instance="foreign-instance"}'
        values: '1000x17'
      - series: 'node_uname_info{job="node-exporter",instance="remote-node",nodename="remote-k3s-node"}'
        values: '1x17'
      - series: 'node_uname_info{job="node-exporter",instance="foreign-instance",nodename="foreign-node"}'
        values: '1x17'
      - series: 'kube_pod_info{namespace="stratum",pod="stratum-abc",node="remote-k3s-node"}'
        values: '1x17'
      - series: 'kubelet_volume_stats_used_bytes{namespace="stratum",persistentvolumeclaim="warning-pvc"}'
        values: '85x17'
      - series: 'kubelet_volume_stats_capacity_bytes{namespace="stratum",persistentvolumeclaim="warning-pvc"}'
        values: '100x17'
      - series: 'kubelet_volume_stats_used_bytes{namespace="stratum",persistentvolumeclaim="critical-pvc"}'
        values: '95x17'
      - series: 'kubelet_volume_stats_capacity_bytes{namespace="stratum",persistentvolumeclaim="critical-pvc"}'
        values: '100x17'
    promql_expr_test:
      - expr: ALERTS{alertname="StratumNodeMemoryLow",alertstate="firing"}
        eval_time: 15m
        exp_samples:
          - labels: '{__name__="ALERTS",alertname="StratumNodeMemoryLow",alertstate="firing",component="node",environment="remote-test",instance="remote-node",node="remote-k3s-node",service="stratum",severity="warning"}'
            value: 1
      - expr: ALERTS{alertname="StratumPVCUsageHigh",alertstate="firing",persistentvolumeclaim="warning-pvc"}
        eval_time: 15m
        exp_samples:
          - labels: '{__name__="ALERTS",alert_family="pvc-usage",alertname="StratumPVCUsageHigh",alertstate="firing",component="storage",environment="remote-test",namespace="stratum",persistentvolumeclaim="warning-pvc",service="stratum",severity="warning"}'
            value: 1
      - expr: ALERTS{alertname="StratumPVCUsageCritical",alertstate="firing"}
        eval_time: 5m
        exp_samples:
          - labels: '{__name__="ALERTS",alert_family="pvc-usage",alertname="StratumPVCUsageCritical",alertstate="firing",component="storage",environment="remote-test",namespace="stratum",persistentvolumeclaim="critical-pvc",service="stratum",severity="critical"}'
            value: 1

  - name: capacity rules detect node and container saturation
    interval: 1m
    input_series:
      - series: 'node_cpu_seconds_total{instance="remote-node",cpu="0",mode="idle"}'
        values: '0+5x20'
      - series: 'node_filesystem_avail_bytes{instance="remote-node",device="/dev/root",mountpoint="/",fstype="ext4"}'
        values: '10x20'
      - series: 'node_filesystem_size_bytes{instance="remote-node",device="/dev/root",mountpoint="/",fstype="ext4"}'
        values: '100x20'
      - series: 'node_filesystem_files_free{instance="remote-node",device="/dev/root",mountpoint="/",fstype="ext4"}'
        values: '10x20'
      - series: 'node_filesystem_files{instance="remote-node",device="/dev/root",mountpoint="/",fstype="ext4"}'
        values: '100x20'
      - series: 'container_memory_working_set_bytes{namespace="stratum",pod="stratum-abc",container="stratum"}'
        values: '95x20'
      - series: 'container_spec_memory_limit_bytes{namespace="stratum",pod="stratum-abc",container="stratum"}'
        values: '100x20'
      - series: 'container_cpu_cfs_throttled_periods_total{namespace="stratum",pod="stratum-abc",container="stratum"}'
        values: '0+4x20'
      - series: 'container_cpu_cfs_periods_total{namespace="stratum",pod="stratum-abc",container="stratum"}'
        values: '0+10x20'
      - series: 'node_uname_info{job="node-exporter",instance="remote-node",nodename="remote-k3s-node"}'
        values: '1x20'
      - series: 'kube_pod_info{namespace="stratum",pod="stratum-abc",node="remote-k3s-node"}'
        values: '1x20'
    promql_expr_test:
      - expr: ALERTS{alertname=~"StratumNodeCPUHigh|StratumNodeFilesystemLow|StratumNodeInodesLow|StratumContainerMemoryNearLimit|StratumContainerCPUThrottled",alertstate="firing"}
        eval_time: 17m
        exp_samples:
          - labels: '{__name__="ALERTS",alertname="StratumNodeCPUHigh",alertstate="firing",component="node",environment="remote-test",instance="remote-node",node="remote-k3s-node",service="stratum",severity="warning"}'
            value: 1
          - labels: '{__name__="ALERTS",alertname="StratumNodeFilesystemLow",alertstate="firing",component="storage",device="/dev/root",environment="remote-test",fstype="ext4",instance="remote-node",mountpoint="/",node="remote-k3s-node",service="stratum",severity="warning"}'
            value: 1
          - labels: '{__name__="ALERTS",alertname="StratumNodeInodesLow",alertstate="firing",component="storage",device="/dev/root",environment="remote-test",fstype="ext4",instance="remote-node",mountpoint="/",node="remote-k3s-node",service="stratum",severity="warning"}'
            value: 1
          - labels: '{__name__="ALERTS",alertname="StratumContainerMemoryNearLimit",alertstate="firing",component="workload",container="stratum",environment="remote-test",namespace="stratum",pod="stratum-abc",service="stratum",severity="warning"}'
            value: 1
          - labels: '{__name__="ALERTS",alertname="StratumContainerCPUThrottled",alertstate="firing",component="workload",container="stratum",environment="remote-test",namespace="stratum",pod="stratum-abc",service="stratum",severity="warning"}'
            value: 1

  - name: PVC prediction requires six hours of positive growth
    interval: 30s
    input_series:
      - series: 'kubelet_volume_stats_used_bytes{namespace="stratum",persistentvolumeclaim="growing-pvc"}'
        values: '1000000+1000000x724'
      - series: 'kubelet_volume_stats_available_bytes{namespace="stratum",persistentvolumeclaim="growing-pvc"}'
        values: '800000000-1000000x724'
      - series: 'kubelet_volume_stats_used_bytes{namespace="stratum",persistentvolumeclaim="flat-pvc"}'
        values: '1000000x724'
      - series: 'kubelet_volume_stats_available_bytes{namespace="stratum",persistentvolumeclaim="flat-pvc"}'
        values: '800000000x724'
      - series: 'kubelet_volume_stats_used_bytes{namespace="stratum",persistentvolumeclaim="shrinking-pvc"}'
        values: '800000000-1000000x724'
      - series: 'kubelet_volume_stats_available_bytes{namespace="stratum",persistentvolumeclaim="shrinking-pvc"}'
        values: '1000000+1000000x724'
      - series: 'kubelet_volume_stats_used_bytes{namespace="stratum",persistentvolumeclaim="young-pvc"}'
        values: '_x604 1000000+1000000x120'
      - series: 'kubelet_volume_stats_available_bytes{namespace="stratum",persistentvolumeclaim="young-pvc"}'
        values: '_x604 800000000-1000000x120'
      - series: 'kubelet_volume_stats_used_bytes{namespace="stratum",persistentvolumeclaim="mismatched-pvc"}'
        values: '1000000+1000000x724'
      - series: 'kubelet_volume_stats_available_bytes{namespace="stratum",persistentvolumeclaim="mismatched-pvc"}'
        values: '_x604 800000000-1000000x120'
    promql_expr_test:
      - expr: stratum:pvc_exhaustion_within_4d
        eval_time: 6h2m
        exp_samples:
          - labels: '{__name__="stratum:pvc_exhaustion_within_4d",namespace="stratum",persistentvolumeclaim="growing-pvc"}'
            value: 1
  - name: PVC prediction history gate is independent of scrape interval
    interval: 1h
    input_series:
      - series: 'kubelet_volume_stats_used_bytes{namespace="stratum",persistentvolumeclaim="hourly-pvc"}'
        values: '100000000+100000000x7'
      - series: 'kubelet_volume_stats_available_bytes{namespace="stratum",persistentvolumeclaim="hourly-pvc"}'
        values: '800000000-100000000x7'
    promql_expr_test:
      - expr: stratum:pvc_exhaustion_within_4d
        eval_time: 6h
        exp_samples:
          - labels: '{__name__="stratum:pvc_exhaustion_within_4d",namespace="stratum",persistentvolumeclaim="hourly-pvc"}'
            value: 1
      - expr: stratum:pvc_exhaustion_within_1d
        eval_time: 6h
        exp_samples:
          - labels: '{__name__="stratum:pvc_exhaustion_within_1d",namespace="stratum",persistentvolumeclaim="hourly-pvc"}'
            value: 1

  - name: filesystem prediction requires elapsed history and positive growth
    interval: 1h
    input_series:
      - series: 'node_filesystem_avail_bytes{instance="remote-node",device="/dev/root",mountpoint="/",fstype="ext4"}'
        values: '800000000-100000000x8'
      - series: 'node_filesystem_avail_bytes{instance="remote-node",device="/dev/data",mountpoint="/data",fstype="ext4"}'
        values: '800000000x8'
      - series: 'node_filesystem_avail_bytes{instance="remote-node",device="/dev/archive",mountpoint="/data",fstype="xfs"}'
        values: '100000000+100000000x8'
      - series: 'node_filesystem_avail_bytes{instance="young-node",device="/dev/root",mountpoint="/",fstype="ext4"}'
        values: '_x2 800000000-100000000x6'
      - series: 'node_uname_info{job="node-exporter",instance="remote-node",nodename="remote-k3s-node"}'
        values: '1x8'
      - series: 'node_uname_info{job="node-exporter",instance="young-node",nodename="young-k3s-node"}'
        values: '1x8'
      - series: 'kube_pod_info{namespace="stratum",pod="stratum-abc",node="remote-k3s-node"}'
        values: '1x8'
    promql_expr_test:
      - expr: stratum:filesystem_exhaustion_within_4d
        eval_time: 6h
        exp_samples:
          - labels: '{__name__="stratum:filesystem_exhaustion_within_4d",device="/dev/root",fstype="ext4",instance="remote-node",mountpoint="/",node="remote-k3s-node"}'
            value: 1
      - expr: stratum:filesystem_exhaustion_within_1d
        eval_time: 6h
        exp_samples:
          - labels: '{__name__="stratum:filesystem_exhaustion_within_1d",device="/dev/root",fstype="ext4",instance="remote-node",mountpoint="/",node="remote-k3s-node"}'
            value: 1
  - name: filesystem exhaustion predictions persist into alerts
    interval: 5m
    input_series:
      - series: 'node_filesystem_avail_bytes{instance="remote-node",device="/dev/root",mountpoint="/",fstype="ext4"}'
        values: '800000000-10000000x76'
      - series: 'node_uname_info{job="node-exporter",instance="remote-node",nodename="remote-k3s-node"}'
        values: '1x76'
      - series: 'kube_pod_info{namespace="stratum",pod="stratum-abc",node="remote-k3s-node"}'
        values: '1x76'
    promql_expr_test:
      - expr: ALERTS{alertname=~"StratumFilesystemExhaustionPredicted|StratumFilesystemExhaustionImminent",alertstate="firing"}
        eval_time: 6h15m
        exp_samples:
          - labels: '{__name__="ALERTS",alert_family="filesystem-exhaustion",alertname="StratumFilesystemExhaustionPredicted",alertstate="firing",component="storage",device="/dev/root",environment="remote-test",fstype="ext4",instance="remote-node",mountpoint="/",node="remote-k3s-node",service="stratum",severity="warning"}'
            value: 1
          - labels: '{__name__="ALERTS",alert_family="filesystem-exhaustion",alertname="StratumFilesystemExhaustionImminent",alertstate="firing",component="storage",device="/dev/root",environment="remote-test",fstype="ext4",instance="remote-node",mountpoint="/",node="remote-k3s-node",service="stratum",severity="critical"}'
            value: 1

  - name: dependency targets disappear independently
    interval: 1m
    input_series:
      - series: 'up{namespace="stratum",service="stratum-etcd-metrics",endpoint="metrics"}'
        values: '0x12'
      - series: 'up{namespace="stratum",service="stratum-milvus-metrics",endpoint="metrics"}'
        values: '0x12'
    promql_expr_test:
      - expr: ALERTS{alertname="StratumDependencyTargetMissing",alertstate="firing"}
        eval_time: 10m
        exp_samples:
          - labels: '{__name__="ALERTS",alertname="StratumDependencyTargetMissing",alertstate="firing",component="dependency",dependency="etcd",endpoint="metrics",environment="remote-test",namespace="stratum",service="stratum",severity="warning"}'
            value: 1
          - labels: '{__name__="ALERTS",alertname="StratumDependencyTargetMissing",alertstate="firing",component="dependency",dependency="milvus",endpoint="metrics",environment="remote-test",namespace="stratum",service="stratum",severity="warning"}'
            value: 1

  - name: absent dependency and exporter series are treated as target loss
    interval: 1m
    promql_expr_test:
      - expr: ALERTS{alertname="StratumDependencyTargetMissing",alertstate="firing"}
        eval_time: 10m
        exp_samples:
          - labels: '{__name__="ALERTS",alertname="StratumDependencyTargetMissing",alertstate="firing",component="dependency",dependency="etcd",endpoint="metrics",environment="remote-test",namespace="stratum",service="stratum",severity="warning"}'
            value: 1
          - labels: '{__name__="ALERTS",alertname="StratumDependencyTargetMissing",alertstate="firing",component="dependency",dependency="milvus",endpoint="metrics",environment="remote-test",namespace="stratum",service="stratum",severity="warning"}'
            value: 1
      - expr: ALERTS{alertname=~"StratumFeishuAdapterMissing|StratumBlackboxExporterMissing",alertstate="firing"}
        eval_time: 10m
        exp_samples:
          - labels: '{__name__="ALERTS",alertname="StratumFeishuAdapterMissing",alertstate="firing",component="notification",endpoint="http",environment="remote-test",namespace="monitoring",service="stratum",severity="critical"}'
            value: 1
          - labels: '{__name__="ALERTS",alertname="StratumBlackboxExporterMissing",alertstate="firing",component="blackbox",endpoint="http",environment="remote-test",namespace="monitoring",service="stratum",severity="critical"}'
            value: 1

  - name: monitoring pipeline failures are observable
    interval: 1m
    input_series:
      - series: 'prometheus_config_last_reload_successful{namespace="monitoring",service="kps-kube-prometheus-stack-prometheus",endpoint="http-web",instance="prometheus-a"}'
        values: '0x12'
      - series: 'prometheus_config_last_reload_successful{namespace="monitoring",service="kps-kube-prometheus-stack-prometheus",endpoint="http-web",instance="prometheus-b"}'
        values: '1x12'
      - series: 'prometheus_config_last_reload_successful{namespace="monitoring",service="foreign-prometheus",endpoint="http-web",instance="foreign"}'
        values: '0x12'
      - series: 'prometheus_rule_evaluation_failures_total{namespace="monitoring",service="kps-kube-prometheus-stack-prometheus",endpoint="http-web",instance="prometheus-a"}'
        values: '0+1x12'
      - series: 'prometheus_rule_evaluation_failures_total{namespace="monitoring",service="kps-kube-prometheus-stack-prometheus",endpoint="http-web",instance="prometheus-b"}'
        values: '0+2x12'
      - series: 'prometheus_rule_evaluation_failures_total{namespace="monitoring",service="foreign-prometheus",endpoint="http-web",instance="foreign"}'
        values: '0+10x12'
      - series: 'alertmanager_notifications_failed_total{namespace="monitoring",service="kps-kube-prometheus-stack-alertmanager",endpoint="http-web",instance="alertmanager-a",integration="webhook"}'
        values: '0+1x12'
      - series: 'alertmanager_notifications_failed_total{namespace="monitoring",service="kps-kube-prometheus-stack-alertmanager",endpoint="http-web",instance="alertmanager-b",integration="webhook"}'
        values: '0+2x12'
      - series: 'alertmanager_notifications_failed_total{namespace="monitoring",service="foreign-alertmanager",endpoint="http-web",instance="foreign",integration="webhook"}'
        values: '0+10x12'
      - series: 'up{namespace="monitoring",service="stratum-feishu-alert-adapter",endpoint="http"}'
        values: '0x12'
      - series: 'up{namespace="monitoring",service="stratum-blackbox-prometheus-blackbox-exporter",endpoint="http"}'
        values: '0x12'
      - series: 'feishu_alert_delivery_total{namespace="monitoring",service="stratum-feishu-alert-adapter",endpoint="http",instance="adapter-a",status="failed"}'
        values: '0+1x12'
      - series: 'feishu_alert_delivery_total{namespace="monitoring",service="stratum-feishu-alert-adapter",endpoint="http",instance="adapter-b",status="failed"}'
        values: '0+2x12'
      - series: 'feishu_alert_delivery_total{namespace="monitoring",service="foreign-adapter",endpoint="http",instance="foreign",status="failed"}'
        values: '0+10x12'
    promql_expr_test:
      - expr: ALERTS{alertname=~"StratumPrometheusConfigReloadFailed|StratumPrometheusRuleEvaluationFailures|StratumAlertmanagerNotificationFailures|StratumFeishuAdapterMissing|StratumBlackboxExporterMissing|StratumFeishuDeliveryFailures",alertstate="firing"}
        eval_time: 10m
        exp_samples:
          - labels: '{__name__="ALERTS",alertname="StratumPrometheusConfigReloadFailed",alertstate="firing",component="prometheus",environment="remote-test",namespace="monitoring",service="stratum",severity="critical"}'
            value: 1
          - labels: '{__name__="ALERTS",alertname="StratumPrometheusRuleEvaluationFailures",alertstate="firing",component="prometheus",environment="remote-test",namespace="monitoring",service="stratum",severity="warning"}'
            value: 1
          - labels: '{__name__="ALERTS",alertname="StratumAlertmanagerNotificationFailures",alertstate="firing",component="alertmanager",environment="remote-test",namespace="monitoring",service="stratum",severity="critical"}'
            value: 1
          - labels: '{__name__="ALERTS",alertname="StratumFeishuAdapterMissing",alertstate="firing",component="notification",endpoint="http",environment="remote-test",namespace="monitoring",service="stratum",severity="critical"}'
            value: 1
          - labels: '{__name__="ALERTS",alertname="StratumBlackboxExporterMissing",alertstate="firing",component="blackbox",endpoint="http",environment="remote-test",namespace="monitoring",service="stratum",severity="critical"}'
            value: 1
          - labels: '{__name__="ALERTS",alertname="StratumFeishuDeliveryFailures",alertstate="firing",component="notification",environment="remote-test",service="stratum",severity="critical"}'
            value: 1

  - name: monitoring pipeline ignores foreign self metrics
    interval: 1m
    input_series:
      - series: 'prometheus_config_last_reload_successful{namespace="monitoring",service="foreign-prometheus",endpoint="http-web",instance="foreign"}'
        values: '0x12'
      - series: 'prometheus_rule_evaluation_failures_total{namespace="monitoring",service="foreign-prometheus",endpoint="http-web",instance="foreign"}'
        values: '0+10x12'
      - series: 'alertmanager_notifications_failed_total{namespace="monitoring",service="foreign-alertmanager",endpoint="http-web",instance="foreign"}'
        values: '0+10x12'
      - series: 'feishu_alert_delivery_total{namespace="monitoring",service="foreign-adapter",endpoint="http",instance="foreign",status="failed"}'
        values: '0+10x12'
    promql_expr_test:
      - expr: ALERTS{alertname=~"StratumPrometheusConfigReloadFailed|StratumPrometheusRuleEvaluationFailures|StratumAlertmanagerNotificationFailures|StratumFeishuDeliveryFailures",alertstate="firing"}
        eval_time: 10m
        exp_samples: []

  - name: availability alerts respect persistence and recovery
    interval: 1m
    input_series:
      - series: 'probe_success{job="stratum-blackbox-prometheus-blackbox-exporter",service="stratum",environment="remote-test"}'
        values: '0x4 1x3'
      - series: 'kube_deployment_status_replicas_ready{namespace="stratum",deployment="stratum"}'
        values: '0x4 1x3'
      - series: 'kube_deployment_status_replicas_ready{namespace="stratum",deployment="stratum-frontend"}'
        values: '0x4 1x3'
      - series: 'up{namespace="stratum",service="stratum",endpoint="http"}'
        values: '0x11 1x2'
    alert_rule_test:
      - eval_time: 2m
        alertname: StratumPublicEndpointDown
        exp_alerts: []
      - eval_time: 3m
        alertname: StratumPublicEndpointDown
