groups:
  - name: stratum-monitoring
    rules:
      - alert: StratumPrometheusConfigReloadFailed
        expr: min by (namespace) (prometheus_config_last_reload_successful{namespace="monitoring",service="kps-kube-prometheus-stack-prometheus",endpoint="http-web"}) == 0
        for: 10m
        labels:
          severity: critical
          service: stratum
          environment: production
          component: prometheus
        annotations:
          summary: Prometheus configuration reload is failing
          description: Prometheus has reported an unsuccessful configuration reload for ten minutes (current value {{ $value }}).
          dashboard_url: /d/stratum-service-overview
          runbook_url: /docs/operations/alerts/monitoring-system.md#prometheus-config-reload-failed

      - alert: StratumPrometheusRuleEvaluationFailures
        expr: sum by (namespace) (increase(prometheus_rule_evaluation_failures_total{namespace="monitoring",service="kps-kube-prometheus-stack-prometheus",endpoint="http-web"}[10m])) > 0
        for: 5m
        labels:
          severity: warning
          service: stratum
          environment: production
          component: prometheus
        annotations:
          summary: Prometheus rule evaluations are failing
          description: Prometheus recorded rule evaluation failures during the last ten minutes (current value {{ $value }}).
          dashboard_url: /d/stratum-service-overview
          runbook_url: /docs/operations/alerts/monitoring-system.md#prometheus-rule-evaluation-failures

      - alert: StratumAlertmanagerNotificationFailures
        expr: sum by (namespace) (increase(alertmanager_notifications_failed_total{namespace="monitoring",service="kps-kube-prometheus-stack-alertmanager",endpoint="http-web"}[10m])) > 0
        for: 5m
        labels:
          severity: critical
          service: stratum
          environment: production
          component: alertmanager
        annotations:
          summary: Alertmanager notifications are failing
          description: Alertmanager recorded notification delivery failures during the last ten minutes (current value {{ $value }}).
          dashboard_url: /d/stratum-service-overview
          runbook_url: /docs/operations/alerts/monitoring-system.md#alertmanager-notification-failures

      - alert: StratumFeishuAdapterMissing
        expr: absent(up{namespace="monitoring",service="stratum-feishu-alert-adapter",endpoint="http"}) or up{namespace="monitoring",service="stratum-feishu-alert-adapter",endpoint="http"} == 0
        for: 10m
        labels:
          severity: critical
          service: stratum
          environment: production
          component: notification
        annotations:
          summary: Feishu alert adapter is unavailable
          description: Prometheus has been unable to scrape the Feishu adapter for ten minutes (current value {{ $value }}).
          dashboard_url: /d/stratum-service-overview
          runbook_url: /docs/operations/alerts/monitoring-system.md#feishu-adapter-missing

      - alert: StratumBlackboxExporterMissing
        expr: absent(up{namespace="monitoring",service="stratum-blackbox-prometheus-blackbox-exporter",endpoint="http"}) or up{namespace="monitoring",service="stratum-blackbox-prometheus-blackbox-exporter",endpoint="http"} == 0
        for: 10m
        labels:
          severity: critical
          service: stratum
          environment: production
          component: blackbox
        annotations:
          summary: Blackbox Exporter is unavailable
          description: Prometheus has been unable to scrape Blackbox Exporter for ten minutes (current value {{ $value }}).
          dashboard_url: /d/stratum-service-overview
          runbook_url: /docs/operations/alerts/monitoring-system.md#blackbox-exporter-missing

      - alert: StratumFeishuDeliveryFailures
        expr: sum(increase(feishu_alert_delivery_total{namespace="monitoring",service="stratum-feishu-alert-adapter",endpoint="http",status="failed"}[10m])) > 0
        labels:
          severity: critical
          service: stratum
          environment: production
          component: notification
        annotations:
          summary: Feishu alert deliveries are failing
          description: The Feishu adapter recorded at least one failed delivery during the last ten minutes (current value {{ $value }}).
          dashboard_url: /d/stratum-service-overview
          runbook_url: /docs/operations/alerts/monitoring-system.md#feishu-delivery-failures

      - alert: StratumLokiUnavailable
        expr: absent(up{namespace="monitoring",service="loki",endpoint="http"}) or up{namespace="monitoring",service="loki",endpoint="http"} == 0
        for: 10m
        labels:
          severity: critical
          service: stratum
          environment: production
          component: logging
        annotations:
          summary: Loki is unavailable
          description: Prometheus has been unable to scrape Loki for ten minutes (current value {{ $value }}).
          dashboard_url: /d/stratum-service-overview
          runbook_url: /docs/operations/alerts/monitoring-system.md#loki-unavailable

      - alert: StratumPromtailUnavailable
        expr: absent(up{namespace="monitoring",service="promtail",endpoint="http"}) or up{namespace="monitoring",service="promtail",endpoint="http"} == 0
        for: 10m
        labels:
          severity: critical
          service: stratum
          environment: production
          component: logging
        annotations:
          summary: Promtail is unavailable
          description: Prometheus has been unable to scrape Promtail for ten minutes (current value {{ $value }}).
          dashboard_url: /d/stratum-service-overview
          runbook_url: /docs/operations/alerts/monitoring-system.md#promtail-unavailable

      - alert: StratumPromtailNoActiveFiles
        expr: promtail_files_active_total{namespace="monitoring",service="promtail"} == 0
        for: 10m
        labels:
          severity: critical
          service: stratum
          environment: production
          component: logging
        annotations:
          summary: Promtail is not tailing any files
          description: Promtail reports zero active log files for ten minutes (current value {{ $value }}); container logs are not reaching Loki.
          dashboard_url: /d/stratum-service-overview
          runbook_url: /docs/operations/alerts/monitoring-system.md#promtail-no-active-files

      - alert: StratumJaegerUnavailable
        expr: absent(up{namespace="monitoring",service="jaeger",endpoint="admin"}) or up{namespace="monitoring",service="jaeger",endpoint="admin"} == 0
        for: 10m
        labels:
          severity: critical
          service: stratum
          environment: production
          component: tracing
        annotations:
          summary: Jaeger is unavailable
          description: Prometheus has been unable to scrape Jaeger for ten minutes (current value {{ $value }}).
          dashboard_url: /d/stratum-service-overview
          runbook_url: /docs/operations/alerts/monitoring-system.md#jaeger-unavailable

      - alert: StratumOtelCollectorUnavailable
        expr: absent(up{namespace="stratum",service="stratum-otel-collector",endpoint="metrics"}) or up{namespace="stratum",service="stratum-otel-collector",endpoint="metrics"} == 0
        for: 10m
        labels:
          severity: critical
          service: stratum
          environment: production
          component: tracing
        annotations:
          summary: OTel collector is unavailable
          description: Prometheus has been unable to scrape the OTel collector for ten minutes (current value {{ $value }}).
          dashboard_url: /d/stratum-service-overview
          runbook_url: /docs/operations/alerts/monitoring-system.md#otel-collector-unavailable

      - alert: StratumOtelExporterFailures
        expr: sum by (exporter) (increase(otelcol_exporter_send_failed_spans{namespace="stratum",service="stratum-otel-collector",endpoint="metrics"}[10m])) > 0
        for: 5m
        labels:
          severity: warning
          service: stratum
          environment: production
          component: tracing
        annotations:
          summary: OTel collector is failing to export spans
          description: The OTel collector recorded span export failures during the last ten minutes (current value {{ $value }}); traces may be missing.
          dashboard_url: /d/stratum-service-overview
          runbook_url: /docs/operations/alerts/monitoring-system.md#otel-exporter-failures

      # 静默 span 丢失盲区：后端在服务请求，但 collector 的 gRPC 传输零接收。
      # 典型触发是 exporter 长连接被 kube-proxy stale conntrack DNAT 钉在已删除的
      # collector backend（IP 被复用），应用"以为在导出"实际全量送错目标。
      # 现有 StratumOtelCollectorUnavailable/StratumOtelExporterFailures 都覆盖不到
      # 该状态：collector up=1、导出失败=0、但接收=0。
      - alert: StratumOtelReceiverSilent
        expr: |
          (
            absent(otelcol_receiver_accepted_spans{namespace="stratum",service="stratum-otel-collector",transport="grpc"})
            or
            sum(increase(otelcol_receiver_accepted_spans{namespace="stratum",service="stratum-otel-collector",transport="grpc"}[10m])) == 0
          )
          and on() (sum(increase(http_requests_total{namespace="stratum",service="stratum"}[10m])) > 0)
        for: 5m
        labels:
          severity: warning
          service: stratum
          environment: production
          component: tracing
        annotations:
          summary: OTel collector receives no spans from the backend
          description: The backend served HTTP requests during the last ten minutes but the OTel collector accepted zero spans on its gRPC transport (current value {{ $value }}); traces are being silently lost, likely a stale kube-proxy conntrack DNAT pinning the app exporter to a replaced collector backend or a misdirected exporter endpoint.
          dashboard_url: /d/stratum-service-overview
          runbook_url: /docs/operations/alerts/monitoring-system.md#otel-receiver-silent
