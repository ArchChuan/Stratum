{{/*
Pre-upgrade database migration.
Runs golang-migrate against the public schema before new Pods start,
preventing concurrent migration races in multi-replica deployments.
*/}}
{{- if .Values.database.migrationHookEnabled }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "stratum.fullname" . }}-db-migration
  labels:
    {{- include "stratum.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-upgrade,pre-install
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  template:
    metadata:
      name: {{ include "stratum.fullname" . }}-db-migration
      labels:
        {{- include "stratum.selectorLabels" . | nindent 8 }}
    spec:
      restartPolicy: Never
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: migrate
          image: {{ include "stratum.image" .Values.app.image }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          command: ["./migrate-public"]
          env:
            # secret 无 POSTGRES_URL key；与 fix-provider-keys-hook 一致，
            # 由 configmap 字段 + secret 密码拼 URL（$(VAR) 容器内展开）
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.name | quote }}
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_URL
              value: {{ printf "postgres://%s:$(POSTGRES_PASSWORD)@%s:%v/%s?sslmode=%s&sslrootcert=%s" .Values.database.user .Values.database.host .Values.database.port .Values.database.name .Values.database.sslMode .Values.database.sslRootCert | quote }}
            - name: APP_ENV
              value: {{ .Values.config.environment | quote }}
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
{{- end }}
