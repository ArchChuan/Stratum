{{/*
Pre-upgrade secret validation.
Fails fast before any resource update if required secrets are missing,
preventing stuck deployments (e.g. ContainerCreating due to missing TLS certs).

To mark a secret as required, list it in .Values.requiredSecrets.names.
The hook also validates the main credentials secret (secrets.name) and
ingress TLS secrets from .Values.ingress.tls.
*/}}
{{- if .Values.requiredSecrets.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "stratum.fullname" . }}-hook
  labels:
    {{- include "stratum.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-upgrade,pre-install
    helm.sh/hook-weight: "-15"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "stratum.fullname" . }}-hook-secret-reader
  labels:
    {{- include "stratum.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-upgrade,pre-install
    helm.sh/hook-weight: "-15"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "stratum.fullname" . }}-hook-secret-reader
  labels:
    {{- include "stratum.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-upgrade,pre-install
    helm.sh/hook-weight: "-15"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
subjects:
  - kind: ServiceAccount
    name: {{ include "stratum.fullname" . }}-hook
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: {{ include "stratum.fullname" . }}-hook-secret-reader
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "stratum.fullname" . }}-pre-upgrade-secret-check
  labels:
    {{- include "stratum.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-upgrade,pre-install
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  template:
    metadata:
      name: {{ include "stratum.fullname" . }}-pre-upgrade-secret-check
    spec:
      restartPolicy: Never
      serviceAccountName: {{ include "stratum.fullname" . }}-hook
      containers:
        - name: secret-check
          image: bitnami/kubectl:latest
          command:
            - sh
            - -c
            - |
              set -e
              missing=""

              check_secret() {
                name="$1"
                if ! kubectl get secret "$name" -n {{ .Release.Namespace }} >/dev/null 2>&1; then
                  missing="$missing  - $name\n"
                fi
              }

              {{- range .Values.requiredSecrets.names }}
              check_secret {{ . | quote }}
              {{- end }}

              {{- if not .Values.secrets.create }}
              check_secret {{ .Values.secrets.name | quote }}
              {{- end }}

              {{- range .Values.ingress.tls }}
              check_secret {{ .secretName | quote }}
              {{- end }}

              if [ -n "$missing" ]; then
                echo "ERROR: required secrets not found:"
                printf "%b" "$missing"
                echo ""
                echo "Create the missing secrets before upgrading."
                echo "Example: kubectl create secret generic <name> --from-literal=key=value -n {{ .Release.Namespace }}"
                exit 1
              fi
              echo "All required secrets present."
{{- end }}
