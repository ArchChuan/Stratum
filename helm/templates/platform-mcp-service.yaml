{{- if .Values.platformMCP.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: stratum-platform-mcp
  labels:
    {{- include "stratum.labels" . | nindent 4 }}
    app.kubernetes.io/component: platform-mcp
spec:
  type: ClusterIP
  ports:
    - name: https
      port: {{ .Values.platformMCP.service.port }}
      targetPort: https
      protocol: TCP
  selector:
    {{- include "stratum.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: platform-mcp
{{- end }}
