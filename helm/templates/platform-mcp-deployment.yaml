{{- if .Values.platformMCP.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stratum-platform-mcp
  labels:
    {{- include "stratum.labels" . | nindent 4 }}
    app.kubernetes.io/component: platform-mcp
spec:
  replicas: {{ .Values.platformMCP.replicaCount }}
  selector:
    matchLabels:
      {{- include "stratum.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: platform-mcp
  template:
    metadata:
      labels:
        {{- include "stratum.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: platform-mcp
    spec:
      serviceAccountName: stratum-platform-mcp
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: platform-mcp
          image: {{ include "stratum.image" .Values.platformMCP.image | quote }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: https
              containerPort: {{ .Values.platformMCP.service.port }}
              protocol: TCP
          env:
            - name: PLATFORM_MCP_PORT
              value: {{ .Values.platformMCP.service.port | quote }}
            - name: STRATUM_INTERNAL_BASE_URL
              value: https://stratum-internal:8443
            - name: STRATUM_INTERNAL_SERVER_NAME
              value: stratum-internal
            - name: PLATFORM_MCP_TLS_CERT_FILE
              value: /var/run/stratum/tls/tls.crt
            - name: PLATFORM_MCP_TLS_KEY_FILE
              value: /var/run/stratum/tls/tls.key
            - name: PLATFORM_MCP_CLIENT_CA_FILE
              value: /var/run/stratum/tls/ca.crt
          volumeMounts:
            - name: internal-tls
              mountPath: /var/run/stratum/tls
              readOnly: true
          readinessProbe:
            tcpSocket:
              port: https
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: https
            periodSeconds: 10
          resources:
            {{- toYaml .Values.platformMCP.resources | nindent 12 }}
      volumes:
        - name: internal-tls
          secret:
            secretName: stratum-platform-mcp-tls
{{- end }}
