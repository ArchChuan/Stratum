{{- if and .Values.platformMCP.enabled .Values.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: stratum-platform-mcp
  labels:
    {{- include "stratum.labels" . | nindent 4 }}
    {{- with .Values.serviceMonitor.additionalLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
    - name: stratum-platform-mcp
      rules:
        - alert: StratumPlatformMCPNoReadyReplicas
          expr: kube_deployment_status_replicas_available{deployment="stratum-platform-mcp"} < 1
          for: 2m
          labels: { severity: critical }
          annotations:
            summary: 'Platform MCP 无就绪副本 (available={{ `{{ $value }}` }})'
            description: >
              Deployment: {{ `{{ $labels.deployment }}` }},
              Namespace: {{ `{{ $labels.namespace }}` }},
              AvailableReplicas: {{ `{{ $value }}` }}
        - alert: StratumPlatformMCPReadinessFailure
          expr: up{service="stratum-platform-mcp"} == 0
          for: 5m
          labels: { severity: critical }
          annotations:
            summary: 'Platform MCP metrics 端点不可达 (up={{ `{{ $value }}` }})'
            description: >
              Instance: {{ `{{ $labels.instance }}` }},
              Job: {{ `{{ $labels.job }}` }},
              Namespace: {{ `{{ $labels.namespace }}` }}
        - alert: StratumPlatformMCPTokenExchangeErrors
          expr: rate(platform_mcp_token_exchanges_total{outcome="error"}[5m]) > 0.05
          for: 5m
          labels: { severity: warning }
          annotations:
            summary: 'Platform MCP token 交换错误率 {{ `{{ $value | humanize }}` }}/s'
            description: >
              Rate: {{ `{{ $value | humanize }}` }}/s,
              Threshold: 0.05/s,
              Outcome: {{ `{{ $labels.outcome }}` }}
        - alert: StratumPlatformMCPBackendFailures
          expr: sum(rate(platform_mcp_backend_requests_total{status_class=~"5xx|timeout|transport_error"}[5m])) > 0.05
          for: 5m
          labels: { severity: warning }
          annotations:
            summary: 'Platform MCP 后端失败率 {{ `{{ $value | humanize }}` }}/s'
            description: >
              Rate: {{ `{{ $value | humanize }}` }}/s,
              Threshold: 0.05/s,
              StatusClass: {{ `{{ $labels.status_class }}` }}
        - alert: StratumPlatformMCPAuthorizationDenials
          expr: sum(rate(platform_mcp_auth_denials_total[5m])) > 0.2
          for: 5m
          labels: { severity: warning }
          annotations:
            summary: 'Platform MCP 授权拒绝率 {{ `{{ $value | humanize }}` }}/s'
            description: >
              Rate: {{ `{{ $value | humanize }}` }}/s,
              Threshold: 0.2/s
        - alert: StratumPlatformMCPReplayDenials
          expr: sum(rate(platform_mcp_replay_denials_total[5m])) > 0
          for: 2m
          labels: { severity: critical }
          annotations:
            summary: 'Platform MCP 检测到重放攻击 (rate={{ `{{ $value | humanize }}` }}/s)'
            description: >
              Rate: {{ `{{ $value | humanize }}` }}/s
        - alert: StratumPlatformMCPUnknownOutcomes
          expr: increase(platform_mcp_unknown_outcomes_total[10m]) > 0
          labels: { severity: critical }
          annotations:
            summary: 'Platform MCP 未知 mutation 结果 (10min 增加 {{ `{{ $value }}` }})'
            description: >
              Increase10m: {{ `{{ $value }}` }}
        - alert: StratumPlatformMCPContractMismatch
          expr: increase(platform_mcp_contract_mismatches_total[10m]) > 0
          labels: { severity: critical }
          annotations:
            summary: 'Platform MCP 工具契约不匹配 (10min 增加 {{ `{{ $value }}` }})'
            description: >
              Increase10m: {{ `{{ $value }}` }}
        - alert: StratumPlatformMCPCertificateExpiring
          expr: platform_mcp_certificate_expiry_seconds < 604800
          for: 10m
          labels: { severity: warning }
          annotations:
            summary: 'Platform MCP 证书将在 {{ `{{ $value | humanizeDuration }}` }} 后过期'
            description: >
              Instance: {{ `{{ $labels.instance }}` }},
              Pod: {{ `{{ $labels.pod }}` }},
              Namespace: {{ `{{ $labels.namespace }}` }},
              Remaining: {{ `{{ $value | humanizeDuration }}` }} ({{ `{{ $value }}` }}s),
              Threshold: 604800s (7 days)
        - alert: StratumPlatformMCPCertificateRotationFailed
          expr: platform_mcp_certificate_rotation{status_class="error"} == 1
          for: 5m
          labels: { severity: critical }
          annotations:
            summary: 'Platform MCP 证书轮换失败 (status_class={{ `{{ $labels.status_class }}` }})'
            description: >
              StatusClass: {{ `{{ $labels.status_class }}` }}
        - alert: StratumPlatformMCPLatencyBudgetBreach
          expr: histogram_quantile(0.95, sum by (le) (rate(platform_mcp_request_duration_seconds_bucket[10m]))) > 5
          for: 10m
          labels: { severity: warning }
          annotations:
            summary: 'Platform MCP p95 延迟 {{ `{{ $value | humanize }}` }}s 超预算'
            description: >
              P95: {{ `{{ $value | humanize }}` }}s,
              Threshold: 5s,
              Window: 10m
{{- end }}
