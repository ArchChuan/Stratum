{{- if .Values.nacos.enabled }}
# Nacos 外部 MySQL 模式要求 schema 预初始化（config_info 等 10 张表）。
# 镜像 entrypoint 的 initdb 脚本只在空数据目录执行，PVC 复用后不生效，
# 因此用 helm hook Job 在每次安装/升级后幂等灌入（CREATE TABLE IF NOT EXISTS）。
# 不能放 MySQL pod 的 initContainer：initContainer 阶段主容器未启动，等不到就绪。
# 不能放 Nacos pod 的 initContainer：MySQL 未 ready 时 Nacos 无法连库，启动即失败。
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "stratum.fullname" . }}-nacos-mysql-schema
  labels:
    {{- include "stratum.labels" . | nindent 4 }}
    app.kubernetes.io/component: nacos-mysql
data:
  mysql-schema.sql: |
    CREATE TABLE IF NOT EXISTS `config_info` (
      `id` bigint(20) NOT NULL AUTO_INCREMENT COMMENT 'id',
      `data_id` varchar(255) NOT NULL COMMENT 'data_id',
      `group_id` varchar(255) DEFAULT NULL,
      `content` longtext NOT NULL COMMENT 'content',
      `md5` varchar(32) DEFAULT NULL COMMENT 'md5',
      `gmt_create` datetime NOT NULL DEFAULT CURRENT_TIMESTAMP COMMENT '创建时间',
      `gmt_modified` datetime NOT NULL DEFAULT CURRENT_TIMESTAMP COMMENT '修改时间',
      `src_user` text COMMENT 'source user',
      `src_ip` varchar(50) DEFAULT NULL COMMENT 'source ip',
      `app_name` varchar(128) DEFAULT NULL,
      `tenant_id` varchar(128) DEFAULT '' COMMENT '租户字段',
      `c_desc` varchar(256) DEFAULT NULL,
      `c_use` varchar(64) DEFAULT NULL,
      `effect` varchar(64) DEFAULT NULL,
      `type` varchar(64) DEFAULT NULL,
      `c_schema` text,
      `encrypted_data_key` text NOT NULL COMMENT 'encrypted_data_key',
      PRIMARY KEY (`id`),
      UNIQUE KEY `uk_configinfo_datagrouptenant` (`data_id`,`group_id`,`tenant_id`)
    ) ENGINE=InnoDB DEFAULT CHARSET=utf8 COLLATE=utf8_bin COMMENT='config_info';
    CREATE TABLE IF NOT EXISTS `config_info_gray` (
      `id` bigint(20) NOT NULL AUTO_INCREMENT COMMENT 'id',
      `data_id` varchar(255) NOT NULL COMMENT 'data_id',
      `group_id` varchar(255) DEFAULT NULL,
      `content` longtext NOT NULL COMMENT 'content',
      `md5` varchar(32) DEFAULT NULL COMMENT 'md5',
      `src_user` text COMMENT 'source user',
      `src_ip` varchar(50) DEFAULT NULL COMMENT 'source ip',
      `gmt_create` datetime NOT NULL DEFAULT CURRENT_TIMESTAMP COMMENT '创建时间',
      `gmt_modified` datetime NOT NULL DEFAULT CURRENT_TIMESTAMP COMMENT '修改时间',
      `app_name` varchar(128) DEFAULT NULL,
      `tenant_id` varchar(128) DEFAULT '' COMMENT '租户字段',
      `gray_name` varchar(128) NOT NULL COMMENT '灰度名称',
      `gray_rule` text NOT NULL COMMENT '灰度规则',
      `encrypted_data_key` text NOT NULL COMMENT 'encrypted_data_key',
      PRIMARY KEY (`id`),
      UNIQUE KEY `uk_configinfogray_datagrouptenant` (`data_id`,`group_id`,`tenant_id`,`gray_name`)
    ) ENGINE=InnoDB DEFAULT CHARSET=utf8 COLLATE=utf8_bin COMMENT='config_info_gray';
    CREATE TABLE IF NOT EXISTS `config_tags_relation` (
      `id` bigint(20) NOT NULL COMMENT 'id',
      `tag_name` varchar(128) NOT NULL COMMENT 'tag_name',
      `tag_type` varchar(64) DEFAULT NULL COMMENT 'tag_type',
      `data_id` varchar(255) NOT NULL COMMENT 'data_id',
      `group_id` varchar(255) NOT NULL COMMENT 'group_id',
      `tenant_id` varchar(128) DEFAULT '' COMMENT 'tenant_id',
      `nid` bigint(20) NOT NULL AUTO_INCREMENT,
      PRIMARY KEY (`nid`),
      UNIQUE KEY `uk_taginconfiginfo` (`tag_name`,`data_id`,`group_id`,`tenant_id`),
      CONSTRAINT `fk_configtagrelation_configid` FOREIGN KEY (`id`) REFERENCES `config_info` (`id`) ON DELETE CASCADE ON UPDATE NO ACTION
    ) ENGINE=InnoDB DEFAULT CHARSET=utf8 COLLATE=utf8_bin COMMENT='config_tag_relation';
    CREATE TABLE IF NOT EXISTS `group_capacity` (
      `id` bigint(20) unsigned NOT NULL AUTO_INCREMENT COMMENT '主键ID',
      `group_id` varchar(128) NOT NULL DEFAULT '' COMMENT 'Group ID，空字符表示整个集群',
      `quota` int(10) unsigned NOT NULL DEFAULT 0 COMMENT '配额，0表示使用默认值',
      `usage` int(10) unsigned NOT NULL DEFAULT 0 COMMENT '使用量',
      `max_size` int(10) unsigned NOT NULL DEFAULT 0 COMMENT '单个配置大小上限（单位byte），0表示使用默认值',
      `max_aggr_count` int(10) unsigned NOT NULL DEFAULT 0 COMMENT '聚合子配置最大个数，，0表示使用默认值',
      `max_aggr_size` int(10) unsigned NOT NULL DEFAULT 0 COMMENT '单个聚合数据的子配置大小上限（单位byte），0表示使用默认值',
      `max_history_count` int(10) unsigned NOT NULL DEFAULT 0 COMMENT '最大变更历史数量',
      `gmt_create` datetime NOT NULL DEFAULT CURRENT_TIMESTAMP COMMENT '创建时间',
      `gmt_modified` datetime NOT NULL DEFAULT CURRENT_TIMESTAMP COMMENT '修改时间',
      PRIMARY KEY (`id`),
      UNIQUE KEY `uk_group_id` (`group_id`)
    ) ENGINE=InnoDB DEFAULT CHARSET=utf8 COLLATE=utf8_bin COMMENT='集群、各Group容量信息表';
    CREATE TABLE IF NOT EXISTS `his_config_info` (
      `id` bigint(20) unsigned NOT NULL,
      `nid` bigint(20) unsigned NOT NULL AUTO_INCREMENT,
      `data_id` varchar(255) NOT NULL,
      `group_id` varchar(255) NOT NULL,
      `app_name` varchar(128) DEFAULT NULL COMMENT 'app name',
      `content` longtext NOT NULL,
      `md5` varchar(32) DEFAULT NULL,
      `src_user` text COMMENT 'source user',
      `src_ip` varchar(50) DEFAULT NULL COMMENT 'source ip',
      `op_type` char(10) DEFAULT NULL COMMENT 'operation type',
      `gmt_create` datetime NOT NULL DEFAULT CURRENT_TIMESTAMP COMMENT 'create time',
      `gmt_modified` datetime NOT NULL DEFAULT CURRENT_TIMESTAMP,
      `tenant_id` varchar(128) DEFAULT '' COMMENT 'tenant field',
      `encrypted_data_key` text NOT NULL COMMENT 'encrypted_data_key',
      PRIMARY KEY (`nid`),
      KEY `idx_gmt_create` (`gmt_create`),
      KEY `idx_did` (`data_id`),
      KEY `idx_gid` (`group_id`)
    ) ENGINE=InnoDB DEFAULT CHARSET=utf8 COLLATE=utf8_bin COMMENT='多租户改造';
    CREATE TABLE IF NOT EXISTS `tenant_capacity` (
      `id` bigint(20) unsigned NOT NULL AUTO_INCREMENT COMMENT '主键ID',
      `tenant_id` varchar(128) NOT NULL DEFAULT '' COMMENT 'Tenant ID',
      `quota` int(10) unsigned NOT NULL DEFAULT 0 COMMENT '配额，0表示使用默认值',
      `usage` int(10) unsigned NOT NULL DEFAULT 0 COMMENT '使用量',
      `max_size` int(10) unsigned NOT NULL DEFAULT 0 COMMENT '单个配置大小上限（单位byte），0表示使用默认值',
      `max_aggr_count` int(10) unsigned NOT NULL DEFAULT 0 COMMENT '聚合子配置最大个数，0表示使用默认值',
      `max_aggr_size` int(10) unsigned NOT NULL DEFAULT 0 COMMENT '单个聚合数据的子配置大小上限（单位byte），0表示使用默认值',
      `max_history_count` int(10) unsigned NOT NULL DEFAULT 0 COMMENT '最大变更历史数量',
      `gmt_create` datetime NOT NULL DEFAULT CURRENT_TIMESTAMP COMMENT '创建时间',
      `gmt_modified` datetime NOT NULL DEFAULT CURRENT_TIMESTAMP COMMENT '修改时间',
      PRIMARY KEY (`id`),
      UNIQUE KEY `uk_tenant_id` (`tenant_id`)
    ) ENGINE=InnoDB DEFAULT CHARSET=utf8 COLLATE=utf8_bin COMMENT='租户容量信息表';
    CREATE TABLE IF NOT EXISTS `tenant_info` (
      `id` bigint(20) NOT NULL AUTO_INCREMENT COMMENT 'id',
      `kp` varchar(128) NOT NULL COMMENT 'kp',
      `tenant_id` varchar(128) DEFAULT '' COMMENT 'tenant_id',
      `tenant_name` varchar(128) DEFAULT '' COMMENT 'tenant_name',
      `tenant_desc` varchar(256) DEFAULT NULL COMMENT 'tenant_desc',
      `create_source` varchar(32) DEFAULT NULL COMMENT 'create_source',
      `gmt_create` bigint(20) NOT NULL COMMENT '创建时间',
      `gmt_modified` bigint(20) NOT NULL COMMENT '修改时间',
      PRIMARY KEY (`id`),
      UNIQUE KEY `uk_tenant_info_kptenantid` (`kp`,`tenant_id`),
      KEY `idx_tenant_id` (`tenant_id`)
    ) ENGINE=InnoDB DEFAULT CHARSET=utf8 COLLATE=utf8_bin COMMENT='tenant_info';
    CREATE TABLE IF NOT EXISTS `users` (
      `username` varchar(50) NOT NULL PRIMARY KEY,
      `password` varchar(500) NOT NULL,
      `enabled` boolean NOT NULL
    );
    CREATE TABLE IF NOT EXISTS `roles` (
      `username` varchar(50) NOT NULL,
      `role` varchar(50) NOT NULL,
      CONSTRAINT `idx_user_role` UNIQUE (`username`,`role`) USING BTREE
    );
    CREATE TABLE IF NOT EXISTS `permissions` (
      `role` varchar(50) NOT NULL,
      `resource` varchar(255) NOT NULL,
      `action` varchar(8) NOT NULL,
      CONSTRAINT `uk_role_permission` UNIQUE (`role`,`resource`,`action`) USING BTREE
    );
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "stratum.fullname" . }}-nacos-mysql-schema
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
  labels:
    {{- include "stratum.labels" . | nindent 4 }}
    app.kubernetes.io/component: nacos-mysql
spec:
  template:
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      restartPolicy: Never
      containers:
        - name: init-schema
          image: {{ include "stratum.image" .Values.nacos.mysql.image | quote }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              MYSQL_HOST={{ printf "%s-nacos-mysql" (include "stratum.fullname" .) }}
              until mysqladmin ping -h "$MYSQL_HOST" -uroot -p"$MYSQL_ROOT_PASSWORD" --silent; do
                echo "waiting for mysql service ready..."; sleep 3;
              done
              # 必须带 -h：无 -h 时 mysql 客户端走 localhost socket（Job pod 内无 mysqld），必失败
              # set -e 保证 mysql 失败即 Job Failed，暴露 schema 未灌入，而非 echo 兜底伪成功
              mysql -h "$MYSQL_HOST" -uroot -p"$MYSQL_ROOT_PASSWORD" nacos < /schema/mysql-schema.sql
              echo "nacos schema initialized"
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.name | quote }}
                  key: NACOS_MYSQL_PASSWORD
          volumeMounts:
            - name: schema
              mountPath: /schema
              readOnly: true
      volumes:
        - name: schema
          configMap:
            name: {{ include "stratum.fullname" . }}-nacos-mysql-schema
{{- end }}
