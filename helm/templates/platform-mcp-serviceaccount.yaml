{{- if .Values.platformMCP.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: stratum-backend
  labels:
    {{- include "stratum.labels" . | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: stratum-platform-mcp
  labels:
    {{- include "stratum.labels" . | nindent 4 }}
automountServiceAccountToken: false
{{- end }}
