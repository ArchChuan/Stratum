{{- if .Values.nacos.enabled }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "stratum.fullname" . }}-nacos-mysql-data
  labels:
    {{- include "stratum.labels" . | nindent 4 }}
    app.kubernetes.io/component: nacos-mysql
spec:
  accessModes:
    - ReadWriteOnce
  {{- if .Values.persistence.storageClass }}
  storageClassName: {{ .Values.persistence.storageClass | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.nacos.mysql.persistence.size | quote }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "stratum.fullname" . }}-nacos-mysql
  labels:
    {{- include "stratum.labels" . | nindent 4 }}
    app.kubernetes.io/component: nacos-mysql
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "stratum.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: nacos-mysql
  template:
    metadata:
      labels:
        {{- include "stratum.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: nacos-mysql
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # Nacos 外部 MySQL 模式要求 schema 预初始化（config_info 等表）。
      # 镜像 entrypoint 的 initdb 脚本只在空数据目录执行，PVC 复用后不生效，
      # 因此用 initContainer 显式幂等灌入（CREATE TABLE IF NOT EXISTS）。
      initContainers:
        - name: init-schema
          image: {{ include "stratum.image" .Values.nacos.mysql.image | quote }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              until mysqladmin ping -h 127.0.0.1 -uroot -p"$MYSQL_ROOT_PASSWORD" --silent; do
                echo "waiting for mysql ready..."; sleep 2;
              done
              mysql -uroot -p"$MYSQL_ROOT_PASSWORD" nacos < /schema/mysql-schema.sql
              echo "nacos schema initialized"
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.name | quote }}
                  key: NACOS_MYSQL_PASSWORD
          volumeMounts:
            - name: schema
              mountPath: /schema
              readOnly: true
      containers:
        - name: nacos-mysql
          image: {{ include "stratum.image" .Values.nacos.mysql.image | quote }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - name: mysql
              containerPort: 3306
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.name | quote }}
                  key: NACOS_MYSQL_PASSWORD
            - name: MYSQL_DATABASE
              value: nacos
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
          resources:
            {{- toYaml .Values.nacos.mysql.resources | nindent 12 }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "stratum.fullname" . }}-nacos-mysql-data
        - name: schema
          configMap:
            name: {{ include "stratum.fullname" . }}-nacos-mysql-schema
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "stratum.fullname" . }}-nacos-mysql
  labels:
    {{- include "stratum.labels" . | nindent 4 }}
    app.kubernetes.io/component: nacos-mysql
spec:
  type: ClusterIP
  selector:
    {{- include "stratum.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: nacos-mysql
  ports:
    - name: mysql
      port: 3306
      targetPort: mysql
{{- end }}
