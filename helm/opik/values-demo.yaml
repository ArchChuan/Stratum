# Single-node Demo override for the official Comet Opik chart.
# The release is pinned by .github/workflows/deploy.yml to chart 2.1.32.
standalone: true
basicAuth: false
demoDataJob:
  enabled: false
chartMigration:
  enabled: false

component:
  backend:
    replicaCount: 1
    ingress:
      enabled: false
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: 1000m
        memory: 1Gi
  python-backend:
    replicaCount: 1
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi
  frontend:
    replicaCount: 1
    ingress:
      enabled: false
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 250m
        memory: 256Mi

mysql:
  enabled: true
  primary:
    persistence:
      enabled: true
      size: 5Gi
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi

redis:
  enabled: true
  architecture: standalone
  resources:
    requests:
      cpu: 25m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 512Mi
  persistence:
    enabled: true
    size: 2Gi

minio:
  # Trace ingestion does not require object storage, and the Demo node's
  # registry proxy rejects the chart's cloudpirates MinIO image.
  enabled: false

zookeeper:
  enabled: true
  replicaCount: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  persistence:
    enabled: true
    size: 2Gi

clickhouse:
  enabled: true
  shardsCount: 1
  replicasCount: 1
  storage: 10Gi
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 2Gi

altinity-clickhouse-operator:
  enabled: true
  crdHook:
    image:
      # Match the official Opik chart's pinned kubectl image family. The Demo's
      # Docker Hub proxy rejects the Bitnami repository used by the subchart.
      repository: alpine/kubectl
      tag: "1.35.0"
    resources:
      requests:
        cpu: 25m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 128Mi
  metrics:
    enabled: false
  serviceMonitor:
    enabled: false
