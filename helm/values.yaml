# Global settings
global:
  imagePullPolicy: IfNotPresent
  # imagePullSecrets:
  #   - name: regcred

nameOverride: ""
fullnameOverride: ""

imagePullSecrets: []

podAnnotations:
  # Bump when the otel-collector Deployment/Service topology changes: the app's
  # OTLP exporter connection is long-lived and a wrong kube-proxy iptables DNAT
  # (stale EndpointSlice sync) can pin the connection to a replaced collector
  # backend IP. If that IP is reused by another collector, the app silently
  # exports there and traces are lost with no error. Restarting the app breaks
  # the pinned connection; a new value here forces the rollout.
  # "1": first reconnect (rules were stale and pinned to the opik collector IP).
  # "2": reconnect again after kube-proxy DNAT rules had self-healed to 10.42.0.72.
  checksum/otel-collector: "2"

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop:
      - ALL

# Application settings
app:
  replicaCount: 1
  image:
    repository: stratum
    tag: latest
    digest: ""
  service:
    type: ClusterIP
    port: 80
  resources:
    requests:
      memory: "256Mi"
      cpu: "250m"
    limits:
      memory: "512Mi"
      cpu: "500m"
  livenessProbe:
    initialDelaySeconds: 30
    periodSeconds: 10
  readinessProbe:
    initialDelaySeconds: 5
    periodSeconds: 5
  startupProbe:
    enabled: true
    failureThreshold: 30
    periodSeconds: 5
    timeoutSeconds: 3
  rollingUpdate:
    maxUnavailable: 0
    maxSurge: 1
  # deployment strategy: rolling (default) or blueGreen.
  # blueGreen renders two Deployments (stable + canary) and selects
  # active track via deployment.track label on Service.
  strategy: rolling
  # Active track when strategy=blueGreen. Ignored for rolling.
  track: stable

# Frontend settings
frontend:
  enabled: true
  replicaCount: 2
  image:
    repository: stratum-frontend
    tag: latest
    digest: ""
  service:
    type: ClusterIP
    port: 80
  resources:
    requests:
      cpu: "50m"
      memory: "64Mi"
    limits:
      cpu: "200m"
      memory: "128Mi"
  # nginx 反代后端的地址（集群内 service 名）
  backendServiceName: stratum-ai
  backendServicePort: 80
  proxy:
    readTimeout: "60s"
    sendTimeout: "60s"

# Configuration settings
config:
  port: "8080"
  logLevel: "info"
  environment: "demo"
  ginMode: "debug"
  natsUrl: "nats://nats:4222"
  milvusHost: "milvus"
  milvusPort: "19530"
  otelServiceName: "stratum-ai"
  otelExporterType: "otlp"
  otelSamplingRatio: "0.1"
  opikUrl: ""
  opikProject: "stratum"
  opikWorkspace: "default"
  tracePayloadEnabled: "false"
  tracePayloadEndpoint: ""
  tracePayloadBucket: "stratum-trace-evidence"
  tracePayloadUseTls: "false"
  postgresDsn: ""
  redisAddr: ""
  frontendUrl: "http://localhost:3002"
  githubCallbackUrl: "http://localhost:8080/auth/github/callback"
  secureCookies: "false"
  globalAdminGitHubLogin: "ArchChuan"
  # enrich LLM 模型已收口到平台参数 memory.enrich_model（ScopePlatform，运行态热改）。
  # 迁移：确认 glm-4.5-air 已在模型目录注册为 enabled chat 模型后，由超管在
  # 平台设置选择 memory.enrich_model=glm-4.5-air，再删本部署的 env（见 B3）。
  nacosUrl: ""
  nacosNamespace: ""
  nacosUsername: "nacos"

secrets:
  create: false
  name: "stratum-secrets"
  # External Secret rotations must update this value or trigger an explicit rollout.
  externalChecksum: "manual-rollout-required"
  # Used when create=true. Remote demo currently creates this Secret from CI/manual kubectl.
  # GLOBAL_AGENT_SYSTEM_PROMPT: platform-level prompt appended to every agent system prompt.
  data: {}

database:
  external: false
  migrationHookEnabled: true
  # pre-upgrade Job 将 providers.api_key 历史明文回填为 enc:v1: 密文（幂等，
  # 无明文行时零操作）。独立于 migrationHookEnabled：不跑 public 迁移链。
  providerKeyFixHookEnabled: true
  host: "stratum-postgresql"
  port: 5432
  name: "stratum"
  user: "stratum"
  sslMode: "disable"
  sslRootCert: "/etc/ssl/certs/ca-certificates.crt"
  image:
    repository: postgres
    tag: "16-alpine"
    digest: ""
  persistence:
    size: 10Gi
  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"

redis:
  external: false
  host: "stratum-redis"
  port: 6379
  image:
    repository: redis
    tag: "7.2.10-alpine3.21"
    digest: ""
  persistence:
    size: 1Gi
  resources:
    requests:
      cpu: "50m"
      memory: "128Mi"
    limits:
      cpu: "250m"
      memory: "256Mi"

# Message queue settings
nats:
  enabled: true
  host: "stratum-nats"
  image:
    repository: nats
    tag: "2.10.25-alpine"
    digest: ""
  persistence:
    size: 1Gi
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"

# Vector database settings
milvus:
  enabled: true
  image:
    repository: milvusdb/milvus
    tag: "v2.4.15"
    digest: ""
  persistence:
    size: 10Gi
  resources:
    requests:
      cpu: "500m"
      memory: "1Gi"
    limits:
      cpu: "2000m"
      memory: "4Gi"

etcd:
  image:
    repository: quay.io/coreos/etcd
    tag: "v3.5.16"
    digest: ""
  persistence:
    size: 1Gi
  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"

minio:
  image:
    repository: minio/minio
    tag: "latest"
    digest: ""
  rootUser: "minioadmin"
  persistence:
    size: 10Gi
  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"

# Nacos 配置中心（standalone + MySQL 8.4，CD 时镜像由 deploy.yml 发布并锁定 digest）
nacos:
  enabled: false
  image:
    repository: nacos/nacos-server
    tag: "v2.5.1"
    digest: ""
  persistence:
    size: 2Gi
  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      memory: "1Gi"
  mysql:
    image:
      repository: mysql
      tag: "8.4"
      digest: ""
    persistence:
      size: 5Gi
    resources:
      requests:
        cpu: "100m"
        memory: "256Mi"
      limits:
        memory: "1Gi"

# Observability settings
observability:
  enabled: true
  otelCollectorEndpoint: "http://stratum-otel-collector:4317"

# Persistence settings
persistence:
  enabled: true
  storageClass: ""
  size: 10Gi

# Ingress settings
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

podDisruptionBudget:
  enabled: false
  minAvailable: 1

networkPolicy:
  enabled: false

serviceMonitor:
  enabled: false
  interval: 30s
  scrapeTimeout: 10s
  path: /metrics
  additionalLabels: {}

# Pre-upgrade validation: fails fast if listed secrets are missing.
# Lists the main credentials secret, ingress TLS secrets, and any
# additional secrets (e.g. mTLS certs) whose absence would block
# pod startup (ContainerCreating).
requiredSecrets:
  enabled: true
  # Secret names that must exist before install/upgrade.
  # The credentials secret (secrets.name) and ingress TLS secrets
  # are checked automatically.
  names: []
